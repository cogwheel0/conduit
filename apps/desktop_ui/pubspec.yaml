name: conduit_desktop_ui
description: >-
  The Conduit desktop renderer: Jaspr in client mode, pure DOM, Tailwind v4.
  Talks to conduitd over JSON-RPC and holds no business logic of its own.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

# Section 2.2 import rule, enforced by tool/check_package_boundaries.dart in
# CI: this package may import only what it declares below, and may never
# declare dio, drift, conduit_core, conduitd, conduit or flutter. Anything
# that is logic belongs in the daemon, behind RPC. Adding a dependency here
# is therefore the reviewable moment -- which is the point.
dependencies:
  conduit_protocol:
    path: ../../packages/conduit_protocol
  conduit_theme:
    path: ../../packages/conduit_theme
  # The same highlighter the mobile app uses, so a code block looks the same
  # in both. Pure Dart, and it returns a node tree rather than HTML -- which
  # is what lets the renderer build components instead of assigning
  # `innerHTML` with a model's output in it.
  highlight: ^0.7.0
  jaspr: 0.23.4
  jaspr_riverpod: 0.4.6
  jaspr_router: 0.9.0
  json_rpc_2: ^4.1.0
  markdown: ^7.3.0
  stream_channel: ^2.1.2
  # Jaspr types its `EventCallback` against this rather than `package:web`,
  # and it compiles on the VM -- so any file a component imports uses it.
  # `package:web` stays for `bridge.dart`, which only ever runs in Electron.
  universal_web: ^1.1.0
  web: ^1.1.0
  web_socket_channel: ^3.0.3

# Two Jaspr dev packages are deliberately absent; both are toolchain-only and
# neither changes what ships. See docs/BUILDING-DESKTOP.md for the full note.
#
# `jaspr_builder` pins `analyzer ^12.1.0` while the root app's `riverpod_lint`
# needs `analyzer >=13`, and one workspace means one analyzer. Client mode does
# not need what it generates (`@client` hydration stubs and `jaspr_options.dart`
# are server/SSR concerns). The `jaspr` CLI is installed globally with
# `dart pub global activate jaspr_cli`, so its own analyzer pin never reaches
# this lockfile.
#
# `jaspr_tailwind` depends on `build_modules`, which caps at Dart `<3.13.0-z`
# and so cannot resolve against this repo's Dart 3.13.1. Its only job is to run
# the standalone Tailwind CLI as a build step, which tool/tailwind.dart does
# directly against the same pinned CLI version.
dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.10
  jaspr_test: 0.23.4
  lints: ^6.0.0
  # Reads the mobile app's ARB files directly (WP-0.8). Flutter-independent,
  # and run as a CLI rather than a build_runner builder so it adds no
  # constraint to the shared lockfile's analyzer.
  slang: ^4.19.2
  test: ^1.25.0

jaspr:
  mode: client
