include: package:lints/recommended.yaml

analyzer:
  exclude:
    # slang output, regenerated by `dart run slang`. It is git-ignored and
    # restates every ARB key; analyzing it reports warnings about the source
    # catalog (locales carrying keys the English template dropped) that
    # tool/validate_arb_locales.dart already surfaces properly.
    - lib/src/l10n/**
    - build/**
