name: conduitd
description: >-
  The Conduit desktop sidecar. Hosts conduit_core in a native Dart process and
  exposes it to the desktop app over a loopback JSON-RPC WebSocket.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # The diagnostics export's zip.
  archive: ^4.0.9
  args: ^2.5.0
  conduit_core:
    path: ../../packages/conduit_core
  conduit_services:
    path: ../../packages/conduit_services
  conduit_protocol:
    path: ../../packages/conduit_protocol
  # AES-256-GCM for the secure store. The master key comes from the
  # desktop app's keychain item on stdin and never touches disk.
  cryptography: ^2.9.0
  # SHA-256 of downloaded speech models.
  crypto: ^3.0.6
  # The local speech engine, libconduit_whisper, through dart:ffi.
  ffi: ^2.2.0
  drift: ^2.34.0
  hive_ce: ^2.15.0
  path: ^1.9.0
  shelf: ^1.4.0
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  checks: ^0.3.1
  # The time the test fakes read, so a test can fix it with withClock.
  clock: ^1.1.2
  dio: ^5.9.0
  fake_async: ^1.3.3
  json_rpc_2: ^4.1.0
  lints: ^6.0.0
  riverpod: ^3.4.3
  test: ^1.25.0
