name: conduitd
description: >-
  The Conduit desktop sidecar. Hosts conduit_core in a native Dart process and
  exposes it to the Electron renderer over a loopback JSON-RPC WebSocket.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.5.0
  conduit_core:
    path: ../../packages/conduit_core
  conduit_protocol:
    path: ../../packages/conduit_protocol
  # AES-256-GCM for the secure store (PLAN.md section 3.3). The master key
  # comes from Electron's safeStorage on stdin and never touches disk.
  cryptography: ^2.9.0
  drift: ^2.34.0
  hive_ce: ^2.15.0
  json_rpc_2: ^4.1.0
  path: ^1.9.0
  riverpod: ^3.4.3
  shelf: ^1.4.0
  shelf_web_socket: ^3.0.0
  stream_channel: ^2.1.2
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
