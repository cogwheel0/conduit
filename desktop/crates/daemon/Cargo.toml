[package]
name = "conduit-daemon"
description = "Conduit Desktop's link to conduitd: supervisor, JSON-RPC client and HTTP client (no GPUI)"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
conduit-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Loopback HTTP only: no TLS and no system proxy (a proxy must never see the
# session token).
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
bytes = "1"
base64 = "0.22"
rand = "0.9"
percent-encoding = "2"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# The Keychain item's data for a create-only add (the version
# security-framework takes).
core-foundation = "0.10"

# The master key's store off the Mac: Credential Manager and the Secret
# Service, through the crates (and features) GPUI already uses for its own
# credentials API. Windows' known folders (Win32_UI_Shell, and COM's
# allocator for the strings it returns), the single-instance pipe (its
# owner-only security descriptor, account and session checks, and handing
# the foreground to the running app), the network monitor
# (Networking_Connectivity), and the job that ends conduitd with the app
# (Win32_System_JobObjects).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Networking_Connectivity", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"
# The desktop portal's network monitor (the version and executor GPUI's
# portal calls use).
ashpd = { version = "0.13", default-features = false, features = ["async-io", "network_monitor"] }
# The wait before the portal is asked again, which the monitor's stop cuts
# short (the executor ashpd runs on).
async-io = "2"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "test-util"] }
# A fresh folder per test that writes files.
tempfile = "3"

[lints]
workspace = true
