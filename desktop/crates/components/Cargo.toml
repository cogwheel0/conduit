[package]
name = "conduit-components"
description = "Conduit Desktop's theme mapping, window helpers and reusable GPUI views"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
gpui-kit = { workspace = true, features = [
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
    "tree-sitter-bash",
] }
ratex-gpui.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSValue"] }
objc2-app-kit = { workspace = true, features = ["NSAccessibilityConstants"] }

[dev-dependencies]
# TestAppContext, for the focus-reveal tests (tests/focus_reveal.rs).
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
