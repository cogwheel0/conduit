# cargo-about's configuration for the bundle's THIRD_PARTY_NOTICES.md (see
# notices.sh). Only what ships: the conduit-desktop binary's normal
# dependencies on Apple Silicon, without build and dev dependencies and
# without our own unpublished crates.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
