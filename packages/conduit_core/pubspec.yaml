name: conduit_core
description: >-
  Conduit's business logic: auth, API, streaming, sync, database, chat state
  and direct connections. Pure Dart (dart:io allowed, no Flutter) so it can be
  hosted by the conduitd sidecar as well as the Flutter app.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # `QueryExecutor` is part of the DatabaseOpener port's signature. The core
  # owns the schema, so drift belongs here rather than in the front-ends.
  archive: ^4.0.9
  xml: ^7.0.1
  mcp_dart: ^2.4.0
  parchment: ^1.27.0
  http: ^1.5.0
  http_parser: ^4.0.2
  ollama_dart: ^2.4.0
  web_socket_channel: ^3.0.3
  collection: ^1.19.1
  hive_ce: ^2.14.0
  intl: ^0.20.2
  openai_dart: ^8.1.0
  socket_io_client: ^3.1.2
  synchronized: ^3.4.1
  web_socket: ^1.0.1
  conduit_markdown:
    path: ../conduit_markdown
  crypto: ^3.0.3
  # The core raises and classifies API errors, and `ApiError` is built from a
  # `DioException`. dio is pure Dart, so this costs the package nothing in
  # portability; the HTTP client itself follows in a later tranche.
  dio: ^5.9.0
  drift: ^2.34.2
  freezed_annotation: ^3.0.0
  html_unescape: ^2.0.0
  json_annotation: ^4.12.0
  markdown: ^7.3.0
  meta: ^1.16.0
  path: ^1.9.0
  # The core owns the provider graph, not just the port interfaces.
  # `riverpod` is pure Dart -- no Flutter, no web restriction -- so this does
  # not weaken the portability the package exists for. `flutter_riverpod`
  # stays in the app.
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  checks: ^0.3.1
  drift_dev: ^2.34.0
  fake_async: ^1.3.3
  freezed: ^4.0.1
  json_serializable: ^6.11.1
  lints: ^6.0.0
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.9
  test: ^1.25.0
