name: conduit_core
description: >-
  Conduit's business logic: auth, API, streaming, sync, database, chat state
  and direct connections. Pure Dart (dart:io allowed, no Flutter) so it can be
  hosted by the conduitd sidecar as well as the Flutter app.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # `QueryExecutor` is part of the DatabaseOpener port's signature. The core
  # owns the schema, so drift belongs here rather than in the front-ends.
  drift: ^2.34.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.15.1
  freezed: ^4.0.1
  json_serializable: ^6.11.1
  lints: ^6.0.0
  test: ^1.25.0
