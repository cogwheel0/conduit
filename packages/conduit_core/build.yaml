# Intentionally minimal.
#
# The models in lib/models moved here from the Flutter app, and their
# generated code must stay byte-identical: the app has no root build.yaml, so
# json_serializable's defaults are what produced the wire format existing
# installs already read. Setting `explicit_to_json` here — tempting, and the
# right choice for a fresh package — would change `toJson()` from "map with
# nested DTOs, resolved later by jsonEncode" to "fully resolved map", which
# anything inspecting a payload before encoding would notice.
targets:
  $default:
    builders:
      json_serializable:
        options: {}
