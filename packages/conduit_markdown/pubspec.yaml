name: conduit_markdown
description: >-
  Pure-Dart markdown preprocessing, Conduit's custom syntaxes, and the parsers
  that turn a model's output into a block model. Shared by the Flutter
  renderer and the desktop DOM renderer; must stay compilable with
  `dart compile js`.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  html_unescape: ^2.0.0
  markdown: ^7.3.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
