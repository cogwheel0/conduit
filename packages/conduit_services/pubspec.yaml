name: conduit_services
description: >-
  The protocol's services over conduit_core: the session layer, the services
  and their composition, and the byte routes, for any host. conduitd hosts
  them for the desktop app.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # Deep hashes of what a message's blocks are made from, for their cache.
  collection: ^1.19.1
  conduit_core:
    path: ../conduit_core
  # The block types the core's message assembly hands back.
  conduit_markdown:
    path: ../conduit_markdown
  conduit_protocol:
    path: ../conduit_protocol
  # SHA-1 of a terminal socket's key.
  crypto: ^3.0.6
  dio: ^5.9.0
  drift: ^2.34.0
  json_rpc_2: ^4.1.0
  mcp_dart: ^2.4.0
  riverpod: ^3.4.3
  stream_channel: ^2.1.2
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  checks: ^0.3.1
  # The time the test fakes read, so a test can fix it with withClock.
  clock: ^1.1.2
  fake_async: ^1.3.3
  # A test's own CPU time (test/support/thread_cpu_time.dart).
  ffi: ^2.2.0
  # The test core's Hive boxes.
  hive_ce: ^2.15.0
  lints: ^6.0.0
  test: ^1.25.0
