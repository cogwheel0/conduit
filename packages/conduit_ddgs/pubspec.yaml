name: conduit_ddgs
description: >-
  Pure-Dart web search scrapers (DuckDuckGo, Brave, Bing, Mojeek, Wikipedia)
  derived from the MIT-licensed `ddgs` package. Lets on-device models search
  the web without an external search service.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  html: ^0.15.6
  http: ^1.5.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
