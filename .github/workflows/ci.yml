name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a Flutter release cannot change what CI means overnight. Keep in
  # step with the `environment` block in pubspec.yaml.
  FLUTTER_VERSION: '3.47.1'

jobs:
  # The gate that matters most during the extraction: the mobile app must stay
  # exactly as it was while code moves out from under it.
  mobile:
    name: Mobile app (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      # One `pub get` at the workspace root resolves every member.
      - run: flutter pub get
      - name: Generate code
        run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  # Each workspace member analyzes and tests on its own, which is what proves
  # the pub workspace actually works per package.
  packages:
    name: Dart packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/conduit_core
          - packages/conduit_markdown
          - packages/conduit_theme
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Only packages that actually declare build_runner have codegen; the
      # step is skipped elsewhere rather than failing on a missing dev dep.
      - name: Generate code
        working-directory: ${{ matrix.package }}
        run: |
          if grep -q '^  build_runner:' pubspec.yaml; then
            dart run build_runner build
          else
            echo "no build_runner in ${{ matrix.package }}; skipping"
          fi
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: ${{ matrix.package }}
        run: dart test

  # Section 2.2: the web-safe packages must survive dart2js, and must not be
  # able to reach dio, drift or conduit_core. Both are cheap to check and
  # expensive to discover late.
  web-safety:
    name: Web-safe packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Check package boundaries
        run: dart run tool/check_package_boundaries.dart
      # conduit_markdown is meant for a web renderer too: compile it and
      # actually run it, rather than trusting the grep.
      - name: Compile markdown package to JS
        working-directory: packages/conduit_markdown
        run: dart compile js -o build/web_safety_check.js test/web_safety_check.dart
      - name: Run markdown web-safety check under Node
        working-directory: packages/conduit_markdown
        run: node build/web_safety_check.js

  localization:
    name: Localization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Verify ARB descriptions
        run: dart run tool/verify_arb_descriptions.dart
      - name: Validate ARB locales and placeholders
        run: dart run tool/validate_arb_locales.dart
