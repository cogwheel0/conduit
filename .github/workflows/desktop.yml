name: Desktop

# The native desktop app's Cargo workspace (desktop/), and the protocol
# crate generated from packages/conduit_protocol.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packages/conduit_protocol/**'
      - 'ios/ConduitProtocol/**'
      # The app's strings are generated from the ARBs (crates/app/build.rs),
      # and the release bundle carries conduitd, with the services, core and
      # markdown packages it is built from.
      - 'lib/l10n/**'
      - 'apps/daemon/**'
      - 'packages/conduit_services/lib/**'
      - 'packages/conduit_services/pubspec.yaml'
      - 'packages/conduit_core/lib/**'
      - 'packages/conduit_core/pubspec.yaml'
      - 'packages/conduit_markdown/lib/**'
      - 'packages/conduit_markdown/pubspec.yaml'
      # The workspace lockfile pins the packages conduitd is built from.
      - 'pubspec.lock'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/conduit_protocol/**'
      - 'ios/ConduitProtocol/**'
      # The app's strings are generated from the ARBs (crates/app/build.rs),
      # and the release bundle carries conduitd, with the services, core and
      # markdown packages it is built from.
      - 'lib/l10n/**'
      - 'apps/daemon/**'
      - 'packages/conduit_services/lib/**'
      - 'packages/conduit_services/pubspec.yaml'
      - 'packages/conduit_core/lib/**'
      - 'packages/conduit_core/pubspec.yaml'
      - 'packages/conduit_markdown/lib/**'
      - 'packages/conduit_markdown/pubspec.yaml'
      # The workspace lockfile pins the packages conduitd is built from.
      - 'pubspec.lock'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release-desktop.yml'
  # Every job, on any branch: Actions › Desktop › Run workflow.
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Disk and cache size: a GPUI workspace's debug target with full debug
  # info and incremental state runs to tens of GB, more than a hosted
  # runner has to spare. CI needs neither (a panic still names its line).
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

# Every job installs the toolchain desktop/rust-toolchain.toml pins
# (channel and components); `rustup toolchain install` with no argument
# reads it from the working directory.
#
# Caches: Cargo's registry and git checkouts, and the jobs' target folders
# with the workspace's own crates cleaned out (they rebuild every run
# anyway). Only pushes to main save them, so pull requests restore main's
# and never evict each other's. The release workflow uses no cache.
jobs:
  # What a pull request needs from the two macOS jobs. Pushes to main, and
  # runs started by hand, run both.
  #
  # macOS runners are few and every pull request queues for them, so on a
  # pull request into another one's branch (a stacked one) both skip: they
  # run once it is retargeted onto main and pushed (retargeting alone starts
  # no run). The release bundle takes the longest, and what it adds to the
  # workspace job is the packaging, so a pull request builds it only when
  # it changes what goes into the bundle or how it is made. The `full-ci`
  # label runs both on any pull request this workflow starts for (its
  # paths above); for any other branch, run the workflow by hand.
  changes:
    name: Desktop changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
      bundle: ${{ steps.diff.outputs.bundle }}
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      # The checked-out ref is the merge commit, so its first parent is the
      # base branch and the diff between them is the pull request's.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          macos=false
          if [ "$BASE_REF" = "$DEFAULT_BRANCH" ] || [ "$FULL" = true ]; then macos=true; fi
          # Packaging, the crates and Dart packages the bundle ships (their
          # licences too), the whisper library only the bundle compiles, and
          # the workflows that build it. The daemon's code has its own macOS
          # build and smoke job (ci.yml), and the app's the workspace job.
          # The Windows and Linux packages follow the same paths, on any
          # pull request: their runners are free.
          packages=$FULL
          if git diff --name-only HEAD^1 HEAD -- \
              desktop/packaging desktop/vendor desktop/Cargo.lock \
              desktop/rust-toolchain.toml ':(glob)desktop/**/Cargo.toml' \
              apps/daemon/native apps/daemon/pubspec.yaml \
              packages/conduit_services/pubspec.yaml pubspec.lock \
              .github/workflows/desktop.yml .github/workflows/release-desktop.yml |
              grep -q .; then
            packages=true
          fi
          bundle=$packages
          [ "$macos" = true ] || bundle=false
          {
            echo "macos=$macos"
            echo "bundle=$bundle"
            echo "packages=$packages"
          } >> "$GITHUB_OUTPUT"

  # desktop/crates/protocol/src/generated.rs and the Swift types in
  # ios/ConduitProtocol must be exactly what the generators write from the
  # Dart DTOs. The Rust one formats with the pinned rustfmt, so this job
  # needs both Dart and Rust; the Swift one needs Dart alone.
  protocol-codegen:
    name: Protocol codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The pub workspace resolves the app's path dependencies too, so the
      # third_party/ submodules are needed for `pub get`.
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install && rustup show active-toolchain
      - name: Regenerate the Rust protocol types
        working-directory: packages/conduit_protocol
        run: dart run tool/generate_rust.dart
      - name: Fail if generated.rs drifted from the Dart source
        run: |
          git diff --exit-code -- desktop/crates/protocol/src/generated.rs || {
            echo "::error::generated.rs is stale: run 'dart run tool/generate_rust.dart' in packages/conduit_protocol and commit it."
            exit 1
          }
      - name: Fail if the Swift protocol types drifted from the Dart source
        working-directory: packages/conduit_protocol
        run: |
          dart run tool/generate_swift.dart --check || {
            echo "::error::Generated.swift is stale: run 'dart run tool/generate_swift.dart' in packages/conduit_protocol and commit it."
            exit 1
          }

  # The protocol crate is plain serde, so it builds everywhere; Windows and
  # Linux check it (and run its conformance tests) ahead of shipping there.
  protocol:
    name: Protocol crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - name: Restore the Cargo cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: desktop-protocol-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
          restore-keys: desktop-protocol-${{ runner.os }}-
      - run: cargo check -p conduit-protocol --locked
      - run: cargo test -p conduit-protocol --locked
      - name: Leave only dependencies in the target folder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo clean -p conduit-protocol
      - name: Save the Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: desktop-protocol-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}

  # Windows and Linux: the whole workspace, checked as the macOS job checks
  # it, so it keeps compiling there ahead of shipping (the Windows/Linux
  # plan's phase 0). These runners are free, so every pull request this
  # workflow starts for runs both. Not required checks yet.
  other-os:
    name: Workspace (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CONDUIT_SKIP_UI_TESTS: '1'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # GPUI (X11, Wayland, fontconfig, xkbcommon) and the web views
      # (WebKitGTK, which brings GTK 3, libsoup 3 and JavaScriptCore).
      # Wayland and Vulkan are loaded at run time and need no headers. The
      # image's Android, .NET and Haskell SDKs make room for the target
      # folder.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev
          df -h / | tail -1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - name: Restore the Cargo cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: desktop-workspace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
          restore-keys: desktop-workspace-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy without the test harness (as a release would build)
        run: cargo clippy -p conduit-desktop --lib --bins --locked -- -D warnings
      # Every test binary runs, so one failing crate hides none of the others.
      - run: cargo test --workspace --locked --no-fail-fast
      # The dev run scripts build the app (with the harness, as the tests
      # already did) and print the binary: they parse, and their path works.
      - name: The dev run script builds the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./crates/app/run.ps1 -BuildOnly
      - name: The dev run script builds the app (Linux)
        if: runner.os == 'Linux'
        run: sh crates/app/run.sh --build-only
      - name: Disk left
        if: always()
        shell: bash
        run: df -h . | tail -1 && du -sh target 2>/dev/null || true
      - name: Leave only dependencies in the target folder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          cargo clean -p conduit-desktop -p conduit-components -p conduit-gallery
          -p conduit-protocol -p conduit-daemon
      - name: Save the Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: desktop-workspace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}

  # macOS is the first desktop platform: the whole workspace, GPUI included.
  macos:
    name: Workspace (macOS)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.macos != 'false') }}
    # Apple silicon with Xcode 26 or later: the app links FoundationModels
    # (macOS 26 SDK) weakly. The same image as the bundle job and the
    # release; DESKTOP_MACOS_RUNNER overrides it for all three.
    runs-on: ${{ vars.DESKTOP_MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    env:
      # The gallery's accessibility test opens real windows.
      CONDUIT_SKIP_UI_TESTS: '1'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pick Xcode 26 or later
        shell: bash
        run: |
          major="$(xcodebuild -version | awk 'NR == 1 {split($2, v, "."); print v[1]}')"
          if [ "$major" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)"
            [ -n "$newest" ] || { echo "::error::Xcode 26 or later is needed"; exit 1; }
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          df -h / | tail -1
      # Xcode 26 builds the Apple models engine without its macOS 27 parts
      # (apple_models.sh sdk-gaps): named on the run, never silent.
      - name: Name what this Xcode's SDK leaves out
        run: packaging/macos/apple_models.sh sdk-gaps --github
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain
      # GPUI compiles its Metal shaders at build time. Xcode 26 ships the
      # Metal compiler as a separate component.
      - name: Make sure the Metal compiler is installed
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Restore the Cargo cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: desktop-workspace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
          restore-keys: desktop-workspace-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --all --check
      # The release scripts' safeguards, against synthetic feeds and stubs.
      - run: packaging/macos/release_test.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Tests build the app with its test harness (`harness`, through the
      # crate's dev-dependency on itself); the release bundle builds it
      # without. Lint that configuration too.
      - name: Clippy without the test harness (as the release bundle builds)
        run: cargo clippy -p conduit-desktop --lib --bins --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Disk left
        if: always()
        run: df -h / | tail -1 && du -sh target 2>/dev/null || true
      - name: Leave only dependencies in the target folder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cargo clean -p conduit-desktop -p conduit-components -p conduit-gallery \
            -p conduit-protocol -p conduit-daemon
          du -sh target
      - name: Save the Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: desktop-workspace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}

  # The release path, without the secrets: packaging/macos/bundle.sh as a
  # rehearsal (--rehearsal: the release's strictness about the Sparkle key,
  # the icon, stripping and dSYMs) on a test bundle id, signed ad hoc, with
  # a throwaway Sparkle public key (so Sparkle is embedded, thinned and
  # signed as in a release); then smoke.sh: the bundle's checks, the bundled
  # conduitd's handshake, and the app's own --shots pass on a throwaway
  # profile with no conduitd left behind. Without llvm-tools, so the
  # fallback strip (Apple's) is the one exercised here.
  bundle:
    name: Release bundle (rehearsal, ad hoc) + smoke
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.bundle != 'false') }}
    runs-on: ${{ vars.DESKTOP_MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pick Xcode 26 or later
        shell: bash
        run: |
          major="$(xcodebuild -version | awk 'NR == 1 {split($2, v, "."); print v[1]}')"
          if [ "$major" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)"
            [ -n "$newest" ] || { echo "::error::Xcode 26 or later is needed"; exit 1; }
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          df -h / | tail -1
      - name: Name what this Xcode's SDK leaves out
        run: desktop/packaging/macos/apple_models.sh sdk-gaps --github
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate Dart code
        shell: bash
        run: |
          for dir in packages/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              echo "::group::build_runner in $dir"
              (cd "$dir" && dart run build_runner build)
              echo "::endgroup::"
            fi
          done
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install && rustup show active-toolchain
      - name: Make sure the Metal compiler is installed
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      # Cargo's downloads only: the release target (line tables, for the
      # dSYMs) would crowd the cache out.
      - name: Restore the Cargo registry
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-registry-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-registry-
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.3
      # bundle.sh builds whisper.cpp with CMake after the Rust build; a
      # missing one would only show half an hour in.
      - name: Make sure CMake is installed
        run: command -v cmake >/dev/null || brew install cmake; cmake --version | head -1
      # THIRD_PARTY_NOTICES.md is generated, not committed: the generator
      # must run and find a licence for everything the app ships.
      - name: Third-party notices (generate, check the licence set)
        run: desktop/packaging/notices/notices.sh --check
      - name: Share extension tests
        run: desktop/packaging/macos/share/test.sh
      - name: Build, sign ad hoc, make the DMG and verify
        shell: bash
        run: |
          # A key made for this run only: its private half is never used.
          SPARKLE_PUBLIC_ED_KEY="$(openssl genpkey -algorithm ed25519 |
            openssl pkey -pubout -outform DER | tail -c 32 | base64)"
          export SPARKLE_PUBLIC_ED_KEY
          desktop/packaging/macos/bundle.sh all --version 0.0.0 \
            --rehearsal --bundle-id app.cogwheel.conduit.desktop.ci
      - name: Smoke-test the bundle
        run: desktop/packaging/macos/smoke.sh desktop/target/macos/Conduit-0.0.0/Conduit.app --launch
      - name: Disk left
        if: always()
        run: df -h / | tail -1 && du -sh desktop/target 2>/dev/null || true
      - name: Save the Cargo registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-registry-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Keep the DMG and the dSYMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-desktop-unsigned-${{ github.sha }}
          path: |
            desktop/target/macos/Conduit-0.0.0/Conduit-0.0.0.dmg
            desktop/target/macos/Conduit-0.0.0/Conduit-0.0.0-dSYMs.zip
          retention-days: 5

  # Windows and Linux: the release path as a rehearsal, unsigned. Each OS
  # builds its packages from a release build (no test harness) and keeps
  # them as workflow artifacts (never a release); a second job on a fresh
  # runner installs them as a user would, runs the installed app's --smoke
  # pass, and uninstalls (packaging/{windows,linux}/smoke.*). The runners
  # are free, so a pull request runs them on the bundle job's paths whatever
  # its base; not required checks yet.
  #
  # Linux builds on Ubuntu 22.04: the .deb's dependencies (dpkg-shlibdeps)
  # and the binaries' glibc are that release's, the oldest the packages
  # support (glibc 2.35). Should the runner image retire, the same steps
  # run in an ubuntu:22.04 container.
  # The third-party notices both packages carry, made once for each target
  # (packaging/notices/notices.sh --target): cargo-about and cargo tree read
  # the target's dependency graph, so Linux makes Windows' too.
  notices:
    name: Third-party notices (Windows, Linux)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.packages != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install && rustup show active-toolchain
      - name: Restore the Cargo registry
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-registry-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-registry-${{ runner.os }}-
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.3
      - name: Make the notices and check the licence sets
        run: |
          desktop/packaging/notices/notices.sh --target x86_64-pc-windows-msvc \
            --out notices/windows/THIRD_PARTY_NOTICES.md
          desktop/packaging/notices/notices.sh --target x86_64-unknown-linux-gnu \
            --out notices/linux/THIRD_PARTY_NOTICES.md
      - name: Keep the notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-desktop-notices-${{ github.sha }}
          path: notices
          if-no-files-found: error
          retention-days: 5

  # The Windows and Linux update feeds' scripts, checked against keys made
  # here (winlinux_feed_test.sh); then the rehearsal's own keys and feeds: a
  # throwaway key pair per OS, whose public halves the rehearsal packages
  # are built with (their feeds on 127.0.0.1), and whose private halves,
  # which never leave this job, sign the feeds for version 0.0.0 that the
  # install smokes serve: WinSparkle and the Linux notice read them and
  # find nothing newer.
  update-feeds:
    name: Update feeds (rehearsal)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.packages != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      windows-key: ${{ steps.feeds.outputs.windows }}
      linux-key: ${{ steps.feeds.outputs.linux }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: The feed scripts' checks
        run: desktop/packaging/winlinux_feed_test.sh
      # The release workflow's publish gate, on the Linux image it runs on.
      - name: The publish gate's checks
        run: desktop/packaging/release_gate_test.sh
      - name: Throwaway keys, and the feeds the install smokes serve
        id: feeds
        run: |
          keys="$RUNNER_TEMP/keys"
          mkdir -m 700 "$keys"
          installer="$RUNNER_TEMP/dist/Conduit-0.0.0-windows-x64-setup.exe"
          mkdir -p "$(dirname "$installer")" feeds
          printf 'a synthetic installer, never downloaded' >"$installer"
          for os in windows linux; do
            openssl genpkey -algorithm ed25519 -outform DER -out "$keys/$os.der"
            public="$(openssl pkey -inform DER -in "$keys/$os.der" -pubout -outform DER | tail -c 32 | base64 -w0)"
            echo "$os=$public" >>"$GITHUB_OUTPUT"
            OS="$(printf '%s' "$os" | tr a-z A-Z)"
            args=(--os "$os" --version 0.0.0 --fresh --work "$RUNNER_TEMP/feed-$os")
            [ "$os" = linux ] || args+=(--installer "$installer")
            # The private key in the environment (a builtin, never argv).
            (
              export "${OS}_ED_PRIVATE_KEY=$(tail -c 32 "$keys/$os.der" | base64 -w0)" "${OS}_PUBLIC_ED_KEY=$public"
              desktop/packaging/winlinux-appcast.sh "${args[@]}"
            )
            mkdir -p "feeds/$os"
            cp "$RUNNER_TEMP/feed-$os/appcast-$os.xml" "feeds/$os/"
          done
      - name: Keep the feeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-desktop-update-feeds-${{ github.sha }}
          path: feeds
          if-no-files-found: error
          retention-days: 5

  package-linux:
    name: Linux packages (rehearsal)
    needs: [notices, update-feeds]
    # The notices job runs where these do; without its notices, no package.
    # The update-feeds job's key is the rehearsal's update notice's.
    if: ${{ !cancelled() && needs.notices.result == 'success' && needs.update-feeds.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The build libraries as the workspace job's, the checks the packages
      # get (desktop-file-validate, lintian, rpmlint, and rpm to list the
      # .rpm's modes), and room for the release target.
      - name: Install the build and packaging tools
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev \
            dpkg-dev desktop-file-utils lintian rpm rpmlint
          df -h / | tail -1
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate Dart code
        run: |
          for dir in packages/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              echo "::group::build_runner in $dir"
              (cd "$dir" && dart run build_runner build)
              echo "::endgroup::"
            fi
          done
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install && rustup show active-toolchain
      - name: Restore the Cargo registry
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-registry-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-registry-${{ runner.os }}-
      - name: Packaging helper tests
        run: python3 desktop/packaging/winlinux_test.py
      # The refusal itself: --notices inside --out (named through ..) stops
      # the build before anything compiles, and nothing is moved or staged.
      - name: package.sh refuses notices inside its output folder
        run: |
          out="$RUNNER_TEMP/guard-out"
          mkdir -p "$out" "$RUNNER_TEMP/guard-x"
          printf '# Third-party notices: Conduit Desktop for Linux\n' >"$out/THIRD_PARTY_NOTICES.md"
          status=0
          desktop/packaging/linux/package.sh --out "$RUNNER_TEMP/guard-x/../guard-out" \
            --notices "$out/THIRD_PARTY_NOTICES.md" >"$RUNNER_TEMP/guard.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/guard.log"
          [ "$status" != 0 ] || { echo "::error::package.sh accepted notices inside --out"; exit 1; }
          grep -q 'is inside --out' "$RUNNER_TEMP/guard.log" || { echo "::error::not the guard's refusal"; exit 1; }
          [ -f "$out/THIRD_PARTY_NOTICES.md" ] && [ ! -e "$out/stage" ] &&
            ! ls -d "$RUNNER_TEMP"/guard-out.old-* 2>/dev/null ||
            { echo "::error::the refused build moved or staged something"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conduit-desktop-notices-${{ github.sha }}
          path: notices
      # Its update notice reads the rehearsal's feed on 127.0.0.1 (the install
      # smoke serves it), checked with the update-feeds job's throwaway key.
      - name: Build the .deb and the .rpm
        env:
          UPDATE_KEY: ${{ needs.update-feeds.outputs.linux-key }}
        run: >-
          desktop/packaging/linux/package.sh --version 0.0.0
          --notices notices/linux/THIRD_PARTY_NOTICES.md
          --update-public-key "$UPDATE_KEY"
          --update-feed-url http://127.0.0.1:8471/appcast-linux.xml
      # What Debian's and Fedora's linters say, for the record: neither
      # fails the job yet (these packages aren't Debian's or Fedora's own).
      - name: lintian and rpmlint (informational)
        run: |
          echo "::group::lintian"
          lintian --no-tag-display-limit desktop/target/linux/Conduit-0.0.0/*.deb || true
          echo "::endgroup::"
          echo "::group::rpmlint"
          rpmlint desktop/target/linux/Conduit-0.0.0/*.rpm || true
          echo "::endgroup::"
      - name: Disk left
        if: always()
        run: df -h / | tail -1 && du -sh desktop/target 2>/dev/null || true
      - name: Save the Cargo registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-registry-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-desktop-linux-unsigned-${{ github.sha }}
          path: |
            desktop/target/linux/Conduit-0.0.0/*.deb
            desktop/target/linux/Conduit-0.0.0/*.rpm
          if-no-files-found: error
          retention-days: 5

  # On a fresh Ubuntu 24.04: the .deb installed with apt, the app's smoke
  # pass under Xvfb (Mesa's software renderers) with GNOME Keyring as the
  # Secret Service, and the removal. Then each package in a clean
  # container of the oldest Ubuntu, Debian and the newest Fedora: its
  # dependencies alone resolve every library, and the app starts.
  install-linux:
    name: Linux install smoke
    needs: package-linux
    # On a push or a run by hand, `changes` is skipped: without this the
    # install job would be skipped with it, though package-linux ran.
    if: ${{ !cancelled() && needs.package-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conduit-desktop-linux-unsigned-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conduit-desktop-update-feeds-${{ github.sha }}
          path: feeds
      # gio and shared-mime-info: the default-app check; xwininfo
      # (x11-utils): the WM_CLASS check.
      - name: Install Xvfb, Mesa, GNOME Keyring, secret-tool, desktop-file-utils, gio and xwininfo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            gnome-keyring libsecret-tools desktop-file-utils \
            libglib2.0-bin shared-mime-info x11-utils
      # The update notice's check reads the rehearsal's feed, served here.
      - name: Install, smoke-test and remove the .deb
        run: >-
          desktop/packaging/linux/smoke.sh --update-feed feeds/linux --update-feed-port 8471
          dist/*.deb "$RUNNER_TEMP/conduit-smoke"
      - name: The .deb in clean Ubuntu 22.04 and Debian 12
        run: |
          for image in ubuntu:22.04 debian:12; do
            echo "::group::$image"
            docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" "$image" \
              bash /src/desktop/packaging/linux/smoke.sh --container "/src/$(ls dist/*.deb)"
            echo "::endgroup::"
          done
      - name: The .rpm in a clean Fedora
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" fedora:latest \
            bash /src/desktop/packaging/linux/smoke.sh --container "/src/$(ls dist/*.rpm)"
      - name: Keep the smoke's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-desktop-linux-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/conduit-smoke
          retention-days: 5

  # Built on D:\ (the workspace's drive), with the C runtime linked in so
  # the installed app needs no Visual C++ Redistributable; Inno Setup is
  # the release tools.env pins (packaging/windows/build.ps1).
  package-windows:
    name: Windows installer (rehearsal)
    needs: [notices, update-feeds]
    # The notices job runs where these do; without its notices, no package.
    # The update-feeds job's key is the rehearsal's WinSparkle's.
    if: ${{ !cancelled() && needs.notices.result == 'success' && needs.update-feeds.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate Dart code
        shell: bash
        run: |
          for dir in packages/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              echo "::group::build_runner in $dir"
              (cd "$dir" && dart run build_runner build)
              echo "::endgroup::"
            fi
          done
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install && rustup show active-toolchain
      - name: Restore the Cargo registry
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-registry-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-registry-${{ runner.os }}-
      - name: Packaging helper tests
        run: python desktop/packaging/winlinux_test.py
      # The refusal itself: -Notices inside -Out (named through ..) stops the
      # build before anything compiles, and nothing is moved or staged.
      - name: build.ps1 refuses notices inside its output folder
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'guard-out'
          New-Item -ItemType Directory -Force -Path $out, (Join-Path $env:RUNNER_TEMP 'guard-x') | Out-Null
          $notices = Join-Path $out 'THIRD_PARTY_NOTICES.md'
          Set-Content -LiteralPath $notices -Value '# Third-party notices: Conduit Desktop for Windows'
          # In this process, so the refusal is the exception's own message.
          $refusal = $null
          try {
            & ./desktop/packaging/windows/build.ps1 -Notices $notices `
              -Out (Join-Path $env:RUNNER_TEMP 'guard-x\..\guard-out')
          } catch {
            $refusal = $_.Exception.Message
          }
          Write-Host "build.ps1: $refusal"
          if (-not $refusal) { throw 'build.ps1 accepted notices inside -Out' }
          if ($refusal -notmatch 'is inside -Out') { throw "not the guard's refusal: $refusal" }
          $moved = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'guard-out.old-*')
          if (-not (Test-Path -LiteralPath $notices) -or (Test-Path -LiteralPath (Join-Path $out 'stage')) -or $moved.Count) {
            throw 'the refused build moved or staged something'
          }
          exit 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conduit-desktop-notices-${{ github.sha }}
          path: notices
      # Its WinSparkle reads the rehearsal's feed on 127.0.0.1 (the install
      # smoke serves it) and trusts the update-feeds job's throwaway key.
      - name: Build the installer
        shell: pwsh
        env:
          UPDATE_KEY: ${{ needs.update-feeds.outputs.windows-key }}
        run: >-
          ./desktop/packaging/windows/build.ps1 -Version 0.0.0
          -Notices notices/windows/THIRD_PARTY_NOTICES.md
          -UpdatePublicKey $env:UPDATE_KEY
          -UpdateFeedUrl http://127.0.0.1:8471/appcast-windows.xml
      - name: Disk left
        if: always()
        shell: bash
        run: df -h . | tail -1 && du -sh desktop/target 2>/dev/null || true
      - name: Save the Cargo registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: desktop-registry-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-desktop-windows-unsigned-${{ github.sha }}
          path: desktop/target/windows/Conduit-0.0.0/Conduit-0.0.0-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 5

  # On a fresh runner, as its user: install, registrations, the app's smoke
  # pass (D3D11 on the runner's WARP adapter), an install over the running
  # app, then the uninstall (packaging/windows/smoke.ps1).
  install-windows:
    name: Windows install smoke
    needs: package-windows
    # On a push or a run by hand, `changes` is skipped: without this the
    # install job would be skipped with it, though package-windows ran.
    if: ${{ !cancelled() && needs.package-windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conduit-desktop-windows-unsigned-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conduit-desktop-update-feeds-${{ github.sha }}
          path: feeds
      # WinSparkle's first check reads the rehearsal's feed, served here.
      # The step's own limit, well under the job's: a step that hangs then
      # fails with its log kept, and the next step keeps the smoke's logs.
      - name: Install, smoke-test and uninstall
        shell: pwsh
        timeout-minutes: 15
        run: >-
          ./desktop/packaging/windows/smoke.ps1
          -Installer dist/Conduit-0.0.0-windows-x64-setup.exe
          -Work "$env:RUNNER_TEMP/conduit-smoke"
          -UpdateFeed feeds/windows -UpdateFeedPort 8471
      - name: Keep the smoke's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-desktop-windows-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/conduit-smoke
          retention-days: 5
