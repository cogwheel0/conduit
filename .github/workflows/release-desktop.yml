name: Release Desktop

# Conduit Desktop for macOS (Apple Silicon, macOS 14+). Pushing a tag
# `desktop-v<version>` builds, signs, notarizes and publishes
# Conduit-<version>.dmg as a GitHub release, then adds it to Sparkle's
# appcast. A `-beta.N` suffix (`desktop-v1.3.0-beta.2`) makes a prerelease
# on the beta channel, which only copies with Settings › About › "Receive
# beta updates" on are offered.
#
# Secrets (Settings › Secrets and variables › Actions; see
# docs/BUILDING-DESKTOP.md for how to make each):
#   MACOS_DEVELOPER_ID_P12           base64 of a .p12 holding the Developer ID
#                                    Application certificate and its key
#   MACOS_DEVELOPER_ID_P12_PASSWORD  the .p12's password
#   MACOS_NOTARY_API_KEY             the App Store Connect API key (.p8 text)
#   MACOS_NOTARY_API_KEY_ID          its key ID
#   MACOS_NOTARY_API_ISSUER_ID       its issuer ID
#   SPARKLE_ED_PRIVATE_KEY           Sparkle's private EdDSA key (generate_keys -x)
# Variable (not secret):
#   SPARKLE_PUBLIC_ED_KEY            the matching public key (SUPublicEDKey)
#
# Each secret is handed only to the step that needs it, and the build steps
# (cargo, dart, cmake) run before any of them is read.
on:
  push:
    tags:
      - 'desktop-v*'

# One release at a time: every run rewrites the shared appcast.
concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, notarize and publish
    # Apple Silicon with Xcode 26 or later (the app links FoundationModels):
    # the image the desktop workflow builds and smoke-tests on, and the
    # same DESKTOP_MACOS_RUNNER override. Pinned rather than macos-latest so
    # an image change never lands in the middle of a release series.
    runs-on: ${{ vars.DESKTOP_MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pick Xcode 26 or later
        shell: bash
        run: |
          major="$(xcodebuild -version | awk 'NR == 1 {split($2, v, "."); print v[1]}')"
          if [ "$major" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)"
            [ -n "$newest" ] || { echo "::error::Xcode 26 or later is needed"; exit 1; }
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version

      - name: Read the version from the tag
        id: version
        shell: bash
        run: |
          . desktop/packaging/macos/lib.sh
          version="${GITHUB_REF_NAME#desktop-v}"
          check_version "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "OUT=$PWD/desktop/target/macos/Conduit-$version" >> "$GITHUB_ENV"
          if is_beta "$version"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Conduit Desktop $version, build $(build_number "$version")"

      - name: Check the release configuration
        env:
          HAS_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 != '' && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD != '' }}
          HAS_NOTARY: ${{ secrets.MACOS_NOTARY_API_KEY != '' && secrets.MACOS_NOTARY_API_KEY_ID != '' && secrets.MACOS_NOTARY_API_ISSUER_ID != '' }}
          HAS_SPARKLE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          missing=""
          [ "$HAS_P12" = true ] || missing="$missing MACOS_DEVELOPER_ID_P12(_PASSWORD)"
          [ "$HAS_NOTARY" = true ] || missing="$missing MACOS_NOTARY_API_KEY(_ID,_ISSUER_ID)"
          [ "$HAS_SPARKLE" = true ] || missing="$missing SPARKLE_ED_PRIVATE_KEY"
          [ -n "$SPARKLE_PUBLIC_ED_KEY" ] || missing="$missing vars.SPARKLE_PUBLIC_ED_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing release configuration:$missing (see docs/BUILDING-DESKTOP.md)"
            exit 1
          fi

      # Only the third_party/ submodules: the pub workspace resolves the
      # mobile app's path dependencies too.
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate Dart code
        shell: bash
        run: |
          for dir in packages/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              echo "::group::build_runner in $dir"
              (cd "$dir" && dart run build_runner build)
              echo "::endgroup::"
            fi
          done
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install && rustup show active-toolchain
      # GPUI compiles its Metal shaders at build time.
      - name: Make sure the Metal compiler is installed
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      # bundle.sh generates the bundle's THIRD_PARTY_NOTICES.md with it.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.3
      # bundle.sh builds whisper.cpp with CMake after the Rust build; a
      # missing one would only show half an hour in.
      - name: Make sure CMake is installed
        run: command -v cmake >/dev/null || brew install cmake; cmake --version | head -1

      - name: Build Conduit.app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: desktop/packaging/macos/bundle.sh build --release --version "$VERSION"

      - name: Import the Developer ID certificate
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in MACOS_DEVELOPER_ID_P12"
            exit 1
          fi
          echo "CONDUIT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # The desktop widget is listed by macOS only when provisioning
      # profiles vouch for the app's and the widget's entitlements
      # (docs/BUILDING-DESKTOP.md); without them the release ships it unlisted.
      - name: Write the provisioning profiles
        env:
          APP_PROFILE: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.MACOS_WIDGET_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$APP_PROFILE" ] || [ -z "$WIDGET_PROFILE" ]; then
            echo "::warning::no MACOS_APP_PROVISIONING_PROFILE / MACOS_WIDGET_PROVISIONING_PROFILE: the widget won't be listed (docs/BUILDING-DESKTOP.md)"
            exit 0
          fi
          printf '%s' "$APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          printf '%s' "$WIDGET_PROFILE" | base64 --decode > "$RUNNER_TEMP/widget.provisionprofile"
          echo "CONDUIT_APP_PROFILE=$RUNNER_TEMP/app.provisionprofile" >> "$GITHUB_ENV"
          echo "CONDUIT_WIDGET_PROFILE=$RUNNER_TEMP/widget.provisionprofile" >> "$GITHUB_ENV"

      - name: Sign
        run: desktop/packaging/macos/bundle.sh sign --release --version "$VERSION"

      - name: Write the notary API key
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          echo "CONDUIT_NOTARY_KEY_FILE=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Notarize and staple the app
        env:
          CONDUIT_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          CONDUIT_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
        run: desktop/packaging/macos/bundle.sh notarize-app --release --version "$VERSION"

      - name: Build the DMG
        run: desktop/packaging/macos/bundle.sh dmg --release --version "$VERSION"

      - name: Notarize and staple the DMG
        env:
          CONDUIT_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          CONDUIT_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
        run: desktop/packaging/macos/bundle.sh notarize-dmg --release --version "$VERSION"

      - name: Verify (codesign, Gatekeeper, architecture, Info.plist)
        run: desktop/packaging/macos/bundle.sh verify --release --version "$VERSION"

      - name: Smoke-test the signed app
        run: desktop/packaging/macos/smoke.sh "$OUT/Conduit.app" --launch

      # Run again after a failure: a DMG already published for this version
      # is the one the feed describes (its bytes may already be downloaded and
      # checked against a feed), so it is reused rather than replaced.
      - name: Reuse the DMG of a release already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . desktop/packaging/macos/lib.sh
          state="$(release_exists "$GITHUB_REF_NAME")"
          if [ "$state" = yes ]; then
            mkdir -p "$OUT/published"
            if gh release download "$GITHUB_REF_NAME" -R "$RELEASE_REPO" -p "Conduit-$VERSION.dmg" -D "$OUT/published"; then
              mv -f "$OUT/published/Conduit-$VERSION.dmg" "$OUT/Conduit-$VERSION.dmg"
              echo "DMG_PUBLISHED=1" >> "$GITHUB_ENV"
              echo "Reusing the published Conduit-$VERSION.dmg"
            else
              echo "The release has no DMG yet: this build's goes up."
            fi
          fi

      # A new feed only when none was ever published: a lookup that fails,
      # or a published feed that cannot be read, stops the release.
      - name: Add the release to the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . desktop/packaging/macos/lib.sh
          state="$(feed_exists)"
          allow=()
          if [ "$state" = no ]; then allow=(--allow-new); fi
          desktop/packaging/macos/appcast.sh --dmg "$OUT/Conduit-$VERSION.dmg" \
            --version "$VERSION" ${allow[@]+"${allow[@]}"}

      # The DMG goes up before the appcast that points at it.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --latest=false --title "Conduit Desktop $VERSION")
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          notes="Conduit Desktop $VERSION for Apple Silicon Macs (macOS 14 Sonoma or later). Download Conduit-$VERSION.dmg, open it and drag Conduit to Applications. Installed copies update themselves."
          [ "$PRERELEASE" = true ] && notes="$notes This is a beta: installed copies get it only with Settings › About › Receive beta updates turned on."
          # Run again after a later step failed: the release is there; its
          # DMG goes up only if it never did (a published one is reused).
          . desktop/packaging/macos/lib.sh
          state="$(release_exists "$GITHUB_REF_NAME")"
          if [ "$state" = no ]; then
            gh release create "$GITHUB_REF_NAME" "$OUT/Conduit-$VERSION.dmg" "${flags[@]}" --notes "$notes"
          elif [ "${DMG_PUBLISHED:-0}" != 1 ]; then
            gh release upload "$GITHUB_REF_NAME" "$OUT/Conduit-$VERSION.dmg" -R "$RELEASE_REPO"
          fi

      - name: Publish the appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: desktop/packaging/macos/publish-appcast.sh "$OUT/appcast/appcast.xml" --push

      - name: Keep the release reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-${{ env.VERSION }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            ${{ env.OUT }}/notary-*.json
            ${{ env.OUT }}/codesign-verify.txt
            ${{ env.OUT }}/appcast/appcast.xml

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
