name: Release Desktop

# Conduit Desktop for macOS (Apple silicon only, macOS 14 Sonoma or later),
# Windows (x64) and Linux (x86_64): one tag releases every OS, each with one
# stable update channel. docs/RELEASING-DESKTOP.md is the runbook.
#
# - Push a tag `desktop-v<X.Y.Z>` (never `-beta.N`: refused).
#   - `winlinux-config` checks the Windows and Linux keys first; every build
#     waits for it, the Mac's too, so a missing secret stops the run in a
#     minute. `draft` then starts the tag's DRAFT release, its notes saying
#     it is still being built.
#   - The `build` job builds Conduit.app with no secret in reach, signs it
#     inside out with the Developer ID certificate from a temporary
#     keychain, notarizes and staples the app and the DMG, verifies and
#     smoke-tests them, signs the Sparkle appcast, and puts the DMG, the
#     dSYMs, the signed appcast.xml and SHA256SUMS.txt on the draft.
#   - `build-windows` and `build-linux` build the installer, the .deb and
#     the .rpm with no secret in reach; `winlinux-feeds` adds the version to
#     each OS's own feed, signed with its own key; `smoke-windows` and
#     `smoke-linux` install them on fresh runners.
#   - `release` puts the Windows and Linux files on the draft, then runs the
#     publish gate (packaging/release_gate.sh) on every file the draft
#     carries, and only then writes its release notes. Nothing reaches
#     installed copies yet.
# - Publish the draft (a person, after checking it). The `feed` job runs
#   the publish gate again: a release that lacks any OS's files or feed, or
#   whose files don't verify, goes back to a draft and no feed changes.
#   Then each feed is checked against the live one, and all three go on the
#   fixed `desktop-appcast` release, the URLs installed copies read
#   (SUFeedURL, and each OS's beside it), and they offer the update.
# - A key rotation's bridge release (docs/RELEASING-DESKTOP.md, "Rotating the
#   Sparkle key") is a tag that the variables SPARKLE_KEY_ROTATION_TAG and
#   SPARKLE_NEXT_PUBLIC_ED_KEY name together: signed with the current key,
#   its app carries the next one. Windows and Linux rotate the same way
#   with their own variables ("Rotating the Windows or Linux key").
# - Run the workflow by hand (workflow_dispatch) for a dry run: every OS's
#   build as a rehearsal, the Mac's on a test bundle id signed ad hoc, with
#   throwaway keys and feeds on 127.0.0.1 that the install smokes read, then
#   the publish gate on what they made: it must pass, and refuse each file
#   in turn when that file is missing. No secret is read, and no release or
#   tag is made or changed.
#
# Secrets and variables: docs/RELEASING-DESKTOP.md, "Secrets and variables".
# Each secret is handed only to the step that needs it, and the builds
# (cargo, dart, cmake) run before any of them is read, apart from the
# configuration checks, which read the private keys only to check that each
# belongs to its public key.
on:
  push:
    tags:
      - 'desktop-v*'
  release:
    types: [published]
  workflow_dispatch:

# No workflow-wide concurrency group: GitHub keeps one pending run per
# group and a newer one cancels it, so every event (mobile releases, dry
# runs) would share one queue with the feed. Each job has its own group,
# entered only when the job runs: a tag's build, the dry runs, and the feed
# publications, one at a time and each in its turn (queue: max).

permissions:
  contents: read

jobs:
  # The Windows and Linux release configuration, checked before anything
  # builds. Each OS's private key is set and belongs to its public key; the
  # rotation variables make sense for this tag (lib.sh release_app_key);
  # and the published feed is signed with a key this release can check it
  # with (lib.sh winlinux_feed_state, feed_signing_key), so a retired key
  # missing or left over stops here, not after an hour of building. Its
  # outputs: the version and the public key each app carries (a bridge
  # release's is the next key). A dry run makes a throwaway key pair per OS
  # instead; their private halves go to the feeds job only.
  winlinux-config:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Windows and Linux keys (dry run, throwaway)' || 'Windows and Linux release configuration' }}
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      version: ${{ steps.config.outputs.version || steps.throwaway.outputs.version }}
      windows-key: ${{ steps.config.outputs.windows-key || steps.throwaway.outputs.windows-key }}
      linux-key: ${{ steps.config.outputs.linux-key || steps.throwaway.outputs.linux-key }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the Windows and Linux keys, and pick each app's
        id: config
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ED_PRIVATE_KEY: ${{ secrets.WINDOWS_ED_PRIVATE_KEY }}
          LINUX_ED_PRIVATE_KEY: ${{ secrets.LINUX_ED_PRIVATE_KEY }}
          WINDOWS_PUBLIC_ED_KEY: ${{ vars.WINDOWS_PUBLIC_ED_KEY }}
          LINUX_PUBLIC_ED_KEY: ${{ vars.LINUX_PUBLIC_ED_KEY }}
          WINDOWS_NEXT_PUBLIC_ED_KEY: ${{ vars.WINDOWS_NEXT_PUBLIC_ED_KEY }}
          LINUX_NEXT_PUBLIC_ED_KEY: ${{ vars.LINUX_NEXT_PUBLIC_ED_KEY }}
          WINDOWS_KEY_ROTATION_TAG: ${{ vars.WINDOWS_KEY_ROTATION_TAG }}
          LINUX_KEY_ROTATION_TAG: ${{ vars.LINUX_KEY_ROTATION_TAG }}
          WINDOWS_RETIRED_PUBLIC_ED_KEY: ${{ vars.WINDOWS_RETIRED_PUBLIC_ED_KEY }}
          LINUX_RETIRED_PUBLIC_ED_KEY: ${{ vars.LINUX_RETIRED_PUBLIC_ED_KEY }}
        run: |
          . desktop/packaging/macos/lib.sh
          version="${GITHUB_REF_NAME#desktop-v}"
          check_version "$version"
          refuse_beta_release "$version"
          if [ "$GITHUB_REPOSITORY" != "$RELEASE_REPO" ]; then
            echo "::error::this repository is $GITHUB_REPOSITORY; release.env publishes to $RELEASE_REPO"
            exit 1
          fi
          missing=""
          for OS in WINDOWS LINUX; do
            private="${OS}_ED_PRIVATE_KEY" public="${OS}_PUBLIC_ED_KEY"
            [ -n "${!private}" ] || missing="$missing $private;"
            [ -n "${!public}" ] || missing="$missing variable $public;"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing release configuration:$missing see docs/RELEASING-DESKTOP.md, \"Windows and Linux updates\""
            exit 1
          fi
          for os in windows linux; do
            OS="$(printf '%s' "$os" | tr a-z A-Z)"
            private="${OS}_ED_PRIVATE_KEY" public="${OS}_PUBLIC_ED_KEY" next="${OS}_NEXT_PUBLIC_ED_KEY"
            rotation="${OS}_KEY_ROTATION_TAG" retired="${OS}_RETIRED_PUBLIC_ED_KEY"
            derived="$(printf '%s' "${!private}" | sparkle_public_key)"
            if [ "$derived" != "${!public}" ]; then
              echo "::error::$private does not belong to $public: installed copies would refuse the update"
              exit 1
            fi
            app_key="$(release_app_key "$GITHUB_REF_NAME" "${!public}" "${!next}" "${!rotation}" "$OS")" || {
              echo "::error::the $OS rotation variables do not make $GITHUB_REF_NAME a bridge release (the log says why; docs/RELEASING-DESKTOP.md, \"Rotating the Windows or Linux key\")"
              exit 1
            }
            if [ "$app_key" != "${!public}" ]; then
              echo "::warning::$os key rotation: $GITHUB_REF_NAME is the bridge release. Its $os item and feed are signed with $private; its app carries $next"
            fi
            state="$(winlinux_feed_state "$os")" ||
              { echo "::error::could not tell whether $os has a published feed (the log says why)"; exit 1; }
            if [ "$state" = live ]; then
              live="$RUNNER_TEMP/live-$os.xml"
              curl -fsSL --retry 3 -o "$live" "$(python3 -I desktop/packaging/winlinux_feed.py url "$os")" ||
                { echo "::error::could not fetch the published $os feed"; exit 1; }
              feed_signing_key "$live" "$os" "${!public}" "${!retired}" >/dev/null ||
                { echo "::error::the published $os feed is not signed with a key this release can check it with (the log says why)"; exit 1; }
            elif [ -n "${!retired}" ]; then
              echo "::error::$retired is set, but $os has no published feed to check with it: delete it"
              exit 1
            else
              echo "::notice::$os has no published feed yet: this is its first release, and its feed starts here"
            fi
            echo "$os-key=$app_key" >>"$GITHUB_OUTPUT"
          done
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Throwaway keys (dry run)
        id: throwaway
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          keys="$RUNNER_TEMP/throwaway-keys"
          mkdir -m 700 "$keys"
          for os in windows linux; do
            openssl genpkey -algorithm ed25519 -outform DER -out "$keys/$os.der"
            public="$(openssl pkey -inform DER -in "$keys/$os.der" -pubout -outform DER | tail -c 32 | base64 -w0)"
            echo "$os-key=$public" >>"$GITHUB_OUTPUT"
            tail -c 32 "$keys/$os.der" | base64 -w0 >"$keys/$os-private-key.txt"
          done
          echo "version=0.0.0" >>"$GITHUB_OUTPUT"
      # The feeds job signs the dry run's feeds with them; nothing they sign
      # is ever published.
      - name: Keep the throwaway private keys for the feeds job (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dry-run-throwaway-keys
          path: ${{ runner.temp }}/throwaway-keys/*-private-key.txt
          if-no-files-found: error
          retention-days: 1

  # The tag's draft release, started before the builds finish so each OS's
  # job adds to the same one (the Mac's through its own "existing draft"
  # path), its notes saying it is still being built: `release` writes the
  # real notes only once the publish gate passes. A release already
  # published under this tag is never changed.
  draft:
    name: Start the draft release
    needs: winlinux-config
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-desktop-draft-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.winlinux-config.outputs.version }}
    steps:
      - name: Create the draft, or take over the one this tag has
        shell: bash
        run: |
          notes="Conduit Desktop $VERSION is still being built. The release workflow writes the release notes here once every OS's files are on this draft and its publish gate passes. Don't publish it before then: publishing an incomplete release puts it back to a draft."
          if draft="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published: its files and feeds stay as they are"
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes "$notes"
            echo "Took over the existing draft $GITHUB_REF_NAME: each OS's job replaces its files"
          else
            case "$draft" in
              *"release not found"*) ;;
              *) echo "::error::could not look up the release $GITHUB_REF_NAME: $draft"; exit 1 ;;
            esac
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag --latest=false \
              --title "Conduit Desktop $VERSION" --notes "$notes"
          fi

  build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Dry run (ad hoc, nothing published)' || 'Build, sign, notarize, draft release' }}
    if: github.event_name != 'release'
    # One tag releases every OS: a Windows or Linux configuration that would
    # stop the release stops this build before it starts.
    needs: winlinux-config
    # Apple silicon with Xcode 26 or later (FoundationModels needs the
    # macOS 26 SDK; the app still runs from macOS 14). The repository
    # variable DESKTOP_MACOS_RUNNER overrides the image.
    runs-on: ${{ vars.DESKTOP_MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 150
    concurrency:
      group: release-desktop-build-${{ github.event_name == 'workflow_dispatch' && 'dry-run' || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read the version
        shell: bash
        run: |
          . desktop/packaging/macos/lib.sh
          if [ "$DRY_RUN" = true ]; then
            version=0.0.0
            # A rehearsal on a test bundle id: --release refuses ad-hoc.
            flags="--rehearsal --bundle-id app.cogwheel.conduit.desktop.dryrun"
          else
            version="${GITHUB_REF_NAME#desktop-v}"
            check_version "$version"
            refuse_beta_release "$version"
            flags="--release"
          fi
          {
            echo "VERSION=$version"
            echo "BUNDLE_FLAGS=$flags"
            echo "OUT=$PWD/desktop/target/macos/Conduit-$version"
          } >> "$GITHUB_ENV"
          echo "Conduit Desktop $version, build $(build_number "$version") ($flags)"

      # Fails in a minute instead of after the build: every secret is
      # present, and the Sparkle key pair matches. It also picks the key the
      # app carries: SPARKLE_PUBLIC_ED_KEY, or the next key for the one tag
      # a key rotation names (lib.sh release_app_key).
      - name: Check the release configuration
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          HAS_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 != '' && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD != '' }}
          HAS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_API_KEY != '' && secrets.MACOS_NOTARY_API_KEY_ID != '' && secrets.MACOS_NOTARY_API_ISSUER_ID != '' }}
          HAS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID != '' && secrets.MACOS_NOTARY_APP_PASSWORD != '' }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_NEXT_PUBLIC_ED_KEY: ${{ vars.SPARKLE_NEXT_PUBLIC_ED_KEY }}
          SPARKLE_KEY_ROTATION_TAG: ${{ vars.SPARKLE_KEY_ROTATION_TAG }}
        run: |
          . desktop/packaging/macos/lib.sh
          missing=""
          [ "$HAS_P12" = true ] || missing="$missing MACOS_DEVELOPER_ID_P12 + MACOS_DEVELOPER_ID_P12_PASSWORD;"
          if [ "$HAS_NOTARY_KEY" != true ] && [ "$HAS_NOTARY_APPLE_ID" != true ]; then
            missing="$missing MACOS_NOTARY_API_KEY + _ID + _ISSUER_ID (or MACOS_NOTARY_APPLE_ID + MACOS_NOTARY_APP_PASSWORD);"
          fi
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || missing="$missing SPARKLE_ED_PRIVATE_KEY;"
          [ -n "$SPARKLE_PUBLIC_ED_KEY" ] || missing="$missing variable SPARKLE_PUBLIC_ED_KEY;"
          if [ -n "$missing" ]; then
            echo "::error::missing release configuration:$missing see docs/RELEASING-DESKTOP.md"
            exit 1
          fi
          derived="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | sparkle_public_key)"
          if [ "$derived" != "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY does not belong to SPARKLE_PUBLIC_ED_KEY: installed copies would refuse the update"
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "$RELEASE_REPO" ]; then
            echo "::error::this repository is $GITHUB_REPOSITORY; release.env publishes to $RELEASE_REPO"
            exit 1
          fi
          app_key="$(release_app_key "$GITHUB_REF_NAME" "$SPARKLE_PUBLIC_ED_KEY" \
            "$SPARKLE_NEXT_PUBLIC_ED_KEY" "$SPARKLE_KEY_ROTATION_TAG")" || {
            echo "::error::the key rotation variables do not make $GITHUB_REF_NAME a bridge release (the log says why; docs/RELEASING-DESKTOP.md, \"Rotating the Sparkle key\")"
            exit 1
          }
          echo "APP_SPARKLE_PUBLIC_ED_KEY=$app_key" >> "$GITHUB_ENV"
          if [ "$app_key" != "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::warning::key rotation: $GITHUB_REF_NAME is the bridge release. Its DMG and feed are signed with SPARKLE_ED_PRIVATE_KEY; its app carries SPARKLE_NEXT_PUBLIC_ED_KEY"
          fi

      - name: Pick Xcode 26 or later
        shell: bash
        run: |
          major="$(xcodebuild -version | awk 'NR == 1 {split($2, v, "."); print v[1]}')"
          if [ "$major" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$newest" ]; then
              echo "::error::Xcode 26 or later is needed (FoundationModels); set DESKTOP_MACOS_RUNNER to an image that has it"
              exit 1
            fi
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          df -h / | tail -1

      # An Xcode older than 27 (macOS 26 SDK) builds the Apple models engine
      # without its macOS 27 parts (apple_models.sh sdk-gaps). The run says
      # which, as an annotation and in its summary, so a release built here
      # is never missing them silently.
      - name: Name what this Xcode's SDK leaves out
        run: desktop/packaging/macos/apple_models.sh sdk-gaps --github

      # Only the third_party/ submodules: the pub workspace resolves the
      # mobile app's path dependencies too.
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate Dart code
        shell: bash
        run: |
          for dir in packages/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              echo "::group::build_runner in $dir"
              (cd "$dir" && dart run build_runner build)
              echo "::endgroup::"
            fi
          done
      # llvm-tools gives bundle.sh rust-objcopy to strip with (local builds
      # without it use Apple's strip); rust-toolchain.toml leaves it out so
      # that not every checkout downloads it.
      - name: Install the pinned Rust toolchain and llvm-tools
        working-directory: desktop
        run: |
          rustup toolchain install
          rustup component add llvm-tools
          rustup show active-toolchain
      # GPUI compiles its Metal shaders at build time.
      - name: Make sure the Metal compiler is installed
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      # bundle.sh generates the bundle's THIRD_PARTY_NOTICES.md with it.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.3
      # bundle.sh builds whisper.cpp with CMake after the Rust build; a
      # missing one would only show half an hour in.
      - name: Make sure CMake is installed
        run: command -v cmake >/dev/null || brew install cmake; cmake --version | head -1

      # The dry run's Sparkle key pair, made for this run only.
      - name: Make a throwaway Sparkle key (dry run)
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          . desktop/packaging/macos/lib.sh
          openssl="$(ed25519_openssl)"
          umask 077
          "$openssl" genpkey -algorithm ed25519 -outform DER -out "$RUNNER_TEMP/sparkle.der"
          public="$("$openssl" pkey -inform DER -in "$RUNNER_TEMP/sparkle.der" -pubout -outform DER | tail -c 32 | base64)"
          {
            echo "SPARKLE_PUBLIC_ED_KEY=$public"
            echo "APP_SPARKLE_PUBLIC_ED_KEY=$public"
            echo "DRY_RUN_SPARKLE_KEY=$RUNNER_TEMP/sparkle.der"
          } >> "$GITHUB_ENV"

      # SUPublicEDKey: the key the configuration check picked (a bridge
      # release's is the next key), or the dry run's throwaway one.
      - name: Build Conduit.app (stripped; dSYMs kept)
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ env.APP_SPARKLE_PUBLIC_ED_KEY }}
        run: desktop/packaging/macos/bundle.sh build $BUNDLE_FLAGS --version "$VERSION"

      - name: Import the Developer ID certificate into a temporary keychain
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in MACOS_DEVELOPER_ID_P12"
            exit 1
          fi
          echo "CONDUIT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # notarytool keeps the credentials in the temporary keychain as a
      # profile, so neither the key nor the password is on a command line
      # later. An App Store Connect API key when present, else an Apple ID
      # with an app-specific password (team: the certificate's).
      - name: Store the notarization credentials
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          . desktop/packaging/macos/lib.sh
          profile=conduit-desktop-notary
          if [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ]; then
            umask 077
            # Gone on every exit, the failed store-credentials included.
            trap 'rm -f "$RUNNER_TEMP/notary-key.p8"' EXIT
            printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
            xcrun notarytool store-credentials "$profile" --keychain "$SIGNING_KEYCHAIN" \
              --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
            rm -f "$RUNNER_TEMP/notary-key.p8"
            echo "notarization: App Store Connect API key"
          else
            signing_identity "$CONDUIT_SIGN_IDENTITY"
            xcrun notarytool store-credentials "$profile" --keychain "$SIGNING_KEYCHAIN" \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$SIGN_TEAM" --password "$NOTARY_APP_PASSWORD"
            echo "notarization: Apple ID with an app-specific password (team $SIGN_TEAM)"
          fi
          echo "CONDUIT_NOTARY_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "CONDUIT_NOTARY_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"

      # The desktop widget is listed by macOS only when provisioning
      # profiles vouch for the app's and the widget's entitlements
      # (docs/BUILDING-DESKTOP.md); without them it ships unlisted.
      - name: Write the provisioning profiles
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          APP_PROFILE: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.MACOS_WIDGET_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$APP_PROFILE" ] || [ -z "$WIDGET_PROFILE" ]; then
            echo "::warning::no MACOS_APP_PROVISIONING_PROFILE / MACOS_WIDGET_PROVISIONING_PROFILE: the widget won't be listed (docs/RELEASING-DESKTOP.md)"
            exit 0
          fi
          printf '%s' "$APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          printf '%s' "$WIDGET_PROFILE" | base64 --decode > "$RUNNER_TEMP/widget.provisionprofile"
          echo "CONDUIT_APP_PROFILE=$RUNNER_TEMP/app.provisionprofile" >> "$GITHUB_ENV"
          echo "CONDUIT_WIDGET_PROFILE=$RUNNER_TEMP/widget.provisionprofile" >> "$GITHUB_ENV"

      # Inside out: conduitd's libraries and conduitd, Sparkle's helpers
      # and framework, the widget's library and extension, the Share
      # extension, the app (bundle.sh sign).
      - name: Sign
        run: desktop/packaging/macos/bundle.sh sign $BUNDLE_FLAGS --version "$VERSION"
      - name: Notarize and staple the app
        run: desktop/packaging/macos/bundle.sh notarize-app $BUNDLE_FLAGS --version "$VERSION"
      - name: Build and sign the DMG
        run: desktop/packaging/macos/bundle.sh dmg $BUNDLE_FLAGS --version "$VERSION"
      - name: Notarize and staple the DMG
        run: desktop/packaging/macos/bundle.sh notarize-dmg $BUNDLE_FLAGS --version "$VERSION"
      - name: Verify (signatures, Gatekeeper, tickets, arm64, macOS 14, stripping, dSYMs)
        run: desktop/packaging/macos/bundle.sh verify $BUNDLE_FLAGS --version "$VERSION"
      - name: Smoke-test the signed app
        run: desktop/packaging/macos/smoke.sh "$OUT/Conduit.app" --launch

      # generate_appcast signs the new item and the feed; appcast.sh checks
      # the key pair, the item (version, macOS 14, arm64, URL), both
      # signatures, and that no earlier item is dropped. A new feed only
      # when none was ever published: a lookup that fails, or a published
      # feed that cannot be read, stops the release. A bridge release is
      # still signed with SPARKLE_ED_PRIVATE_KEY, and appcast.sh checks that
      # its app carries exactly the next key.
      - name: Sign the appcast
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          . desktop/packaging/macos/lib.sh
          state="$(feed_exists)"
          flags=()
          if [ "$state" = no ]; then flags=(--allow-new); fi
          if [ "$APP_SPARKLE_PUBLIC_ED_KEY" != "$SPARKLE_PUBLIC_ED_KEY" ]; then
            flags+=(--next-public-key "$APP_SPARKLE_PUBLIC_ED_KEY")
          fi
          desktop/packaging/macos/appcast.sh --dmg "$OUT/Conduit-$VERSION.dmg" \
            --version "$VERSION" ${flags[@]+"${flags[@]}"}
      - name: Sign the appcast (dry run, throwaway key)
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          SPARKLE_ED_PRIVATE_KEY="$(tail -c 32 "$DRY_RUN_SPARKLE_KEY" | base64)" \
            desktop/packaging/macos/appcast.sh --dmg "$OUT/Conduit-$VERSION.dmg" \
            --version "$VERSION" --fresh --download-url-prefix "https://example.invalid/dry-run/"

      # bash -eo pipefail: a file that cannot be read fails the step, never
      # leaving a partial SHA256SUMS.txt.
      - name: Checksums
        working-directory: ${{ env.OUT }}
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 "Conduit-$VERSION.dmg" "Conduit-$VERSION-dSYMs.zip" appcast/appcast.xml |
            sed 's#appcast/appcast.xml#appcast.xml#' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A draft: only people with write access see it, and installed copies
      # are offered the update only once it is published (the feed job).
      # Never "Latest", which stays the mobile app's.
      # Run again after a failure: the draft this tag made before takes this
      # build's assets (nothing of a draft is live). A published release is
      # never changed here: its DMG is the one its feed describes. The draft
      # is looked up again right before each file replaces its old copy, so
      # one published meanwhile keeps the rest. Immutable releases stay off:
      # the feed release's appcast.xml is replaced at every publication (see
      # docs/RELEASING-DESKTOP.md).
      - name: Create the draft GitHub release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Conduit Desktop $VERSION for Apple silicon Macs (macOS 14 Sonoma or later). Download Conduit-$VERSION.dmg, open it and drag Conduit to Applications. Installed copies update themselves.

          Release assets: the notarized DMG; Conduit-$VERSION-dSYMs.zip, the debug symbols for crash reports; appcast.xml, the signed Sparkle feed that goes live when this release is published; SHA256SUMS.txt."
          assets=("$OUT/Conduit-$VERSION.dmg" "$OUT/Conduit-$VERSION-dSYMs.zip"
            "$OUT/appcast/appcast.xml" "$OUT/SHA256SUMS.txt")
          still_draft() {
            local draft
            draft="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" &&
              [ "$draft" = true ]
          }
          if draft="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published: its DMG and appcast stay as they are"
              exit 1
            fi
            for asset in "${assets[@]}"; do
              if ! still_draft; then
                echo "::error::$GITHUB_REF_NAME was published (or could not be looked up) during this run: its remaining assets stay as they are"
                exit 1
              fi
              gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber "$asset"
            done
            echo "Replaced the assets of the existing draft $GITHUB_REF_NAME"
          else
            case "$draft" in
              *"release not found"*) ;;
              *) echo "::error::could not look up the release $GITHUB_REF_NAME: $draft"; exit 1 ;;
            esac
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --latest=false \
              --title "Conduit Desktop $VERSION" --notes "$notes" "${assets[@]}"
          fi

      - name: Keep the build reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ env.DRY_RUN == 'true' && 'dry-run' || 'release' }}-${{ env.VERSION }}
          retention-days: ${{ env.DRY_RUN == 'true' && 5 || 30 }}
          if-no-files-found: ignore
          path: |
            ${{ env.OUT }}/notary-*.json
            ${{ env.OUT }}/codesign-verify.txt
            ${{ env.OUT }}/appcast/appcast.xml
            ${{ env.OUT }}/SHA256SUMS.txt
            ${{ env.OUT }}/Conduit-*-dSYMs.zip

      # Dry runs only: the publish gate's rehearsal (job `release`) checks
      # these with the Windows and Linux files, the throwaway key's public
      # half included. A release's files are on its draft instead.
      - name: Keep the DMG and its feed for the gate rehearsal (dry run)
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/mac-dry-run"
          mkdir -p "$files"
          cp "$OUT/Conduit-$VERSION.dmg" "$OUT/Conduit-$VERSION-dSYMs.zip" "$OUT/appcast/appcast.xml" \
            "$OUT/SHA256SUMS.txt" "$files/"
          printf '%s\n' "$SPARKLE_PUBLIC_ED_KEY" >"$files/sparkle-public-key.txt"
      - name: Keep them (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dry-run-mac-files
          path: ${{ runner.temp }}/mac-dry-run
          if-no-files-found: error
          retention-days: 1

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi

  # The third-party notices the Windows and Linux packages carry, made for
  # each target (packaging/notices/notices.sh --target), and attached to the
  # release beside them.
  notices:
    name: Third-party notices (Windows, Linux)
    needs: winlinux-config
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install && rustup show active-toolchain
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.3
      - name: Make the notices and check the licence sets
        run: |
          desktop/packaging/notices/notices.sh --target x86_64-pc-windows-msvc \
            --out notices/windows/THIRD_PARTY_NOTICES.md
          desktop/packaging/notices/notices.sh --target x86_64-unknown-linux-gnu \
            --out notices/linux/THIRD_PARTY_NOTICES.md
      - name: Keep the notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-notices
          path: notices
          if-no-files-found: error
          retention-days: 5

  # The Windows installer, built with no secret in reach (build.ps1: the
  # app without the test harness, conduitd, the install folder checked,
  # Inno Setup), unsigned (BUILDING-DESKTOP.md, "Unsigned installers"). Its
  # updater trusts the key `winlinux-config` picked and reads the published
  # Windows feed; a dry run's reads a feed on 127.0.0.1 that its install
  # smoke serves. No cache, as the Mac's build.
  build-windows:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Windows installer (dry run)' || 'Windows installer' }}
    needs: [winlinux-config, notices]
    if: github.event_name != 'release'
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.winlinux-config.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate Dart code
        shell: bash
        run: |
          for dir in packages/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              echo "::group::build_runner in $dir"
              (cd "$dir" && dart run build_runner build)
              echo "::endgroup::"
            fi
          done
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-notices
          path: notices
      - name: Build the installer
        shell: pwsh
        env:
          UPDATE_KEY: ${{ needs.winlinux-config.outputs.windows-key }}
        run: |
          $feed = @{}
          if ($env:DRY_RUN -eq 'true') { $feed.UpdateFeedUrl = 'http://127.0.0.1:8471/appcast-windows.xml' }
          ./desktop/packaging/windows/build.ps1 -Version $env:VERSION `
            -Notices notices/windows/THIRD_PARTY_NOTICES.md -UpdatePublicKey $env:UPDATE_KEY @feed
      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-installer
          path: desktop/target/windows/Conduit-${{ env.VERSION }}/Conduit-${{ env.VERSION }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 5

  # The .deb and the .rpm, built with no secret in reach on Ubuntu 22.04,
  # the oldest the packages support (glibc 2.35), as desktop.yml's
  # rehearsal. Their update notice trusts the key `winlinux-config` picked
  # and reads the published Linux feed; a dry run's reads one on 127.0.0.1.
  build-linux:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Linux packages (dry run)' || 'Linux packages' }}
    needs: [winlinux-config, notices]
    if: github.event_name != 'release'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.winlinux-config.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the build and packaging tools
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev \
            dpkg-dev desktop-file-utils rpm
          df -h / | tail -1
      - name: Fetch third_party submodules
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate Dart code
        run: |
          for dir in packages/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              echo "::group::build_runner in $dir"
              (cd "$dir" && dart run build_runner build)
              echo "::endgroup::"
            fi
          done
      - name: Install the pinned Rust toolchain
        working-directory: desktop
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-notices
          path: notices
      - name: Build the .deb and the .rpm
        env:
          UPDATE_KEY: ${{ needs.winlinux-config.outputs.linux-key }}
        run: |
          feed=()
          if [ "$DRY_RUN" = true ]; then feed=(--update-feed-url http://127.0.0.1:8471/appcast-linux.xml); fi
          desktop/packaging/linux/package.sh --version "$VERSION" \
            --notices notices/linux/THIRD_PARTY_NOTICES.md --update-public-key "$UPDATE_KEY" ${feed[@]+"${feed[@]}"}
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-packages
          path: |
            desktop/target/linux/Conduit-${{ env.VERSION }}/*.deb
            desktop/target/linux/Conduit-${{ env.VERSION }}/*.rpm
          if-no-files-found: error
          retention-days: 5

  # Adds this version to the Windows and Linux feeds (winlinux-appcast.sh),
  # each signed with its OS's private key, read here only. An OS's first
  # release starts its feed (--allow-new: only when the feed release has
  # neither its feed nor a half-finished publication of it, lib.sh
  # winlinux_feed_state). Otherwise the published feed is fetched and added
  # to, once it verifies with the key that signed it (lib.sh
  # feed_signing_key: the current key, or the retired one on the first
  # release after a key swap). A bridge release's app trusts the next key
  # (--next-public-key). Then the OSes' files and their checksum files.
  winlinux-feeds:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Windows and Linux feeds (dry run, throwaway keys)' || 'Sign the Windows and Linux feeds' }}
    needs: [winlinux-config, notices, build-windows, build-linux]
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.winlinux-config.outputs.version }}
      WINDOWS_APP_KEY: ${{ needs.winlinux-config.outputs.windows-key }}
      LINUX_APP_KEY: ${{ needs.winlinux-config.outputs.linux-key }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows-installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux-packages
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-notices
          path: notices
      - name: Add this version to the Windows and Linux feeds
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ED_PRIVATE_KEY: ${{ secrets.WINDOWS_ED_PRIVATE_KEY }}
          LINUX_ED_PRIVATE_KEY: ${{ secrets.LINUX_ED_PRIVATE_KEY }}
          WINDOWS_PUBLIC_ED_KEY: ${{ vars.WINDOWS_PUBLIC_ED_KEY }}
          LINUX_PUBLIC_ED_KEY: ${{ vars.LINUX_PUBLIC_ED_KEY }}
          WINDOWS_RETIRED_PUBLIC_ED_KEY: ${{ vars.WINDOWS_RETIRED_PUBLIC_ED_KEY }}
          LINUX_RETIRED_PUBLIC_ED_KEY: ${{ vars.LINUX_RETIRED_PUBLIC_ED_KEY }}
        run: |
          . desktop/packaging/macos/lib.sh
          for os in windows linux; do
            OS="$(printf '%s' "$os" | tr a-z A-Z)"
            public="${OS}_PUBLIC_ED_KEY" retired="${OS}_RETIRED_PUBLIC_ED_KEY" app="${OS}_APP_KEY"
            args=(--os "$os" --version "$VERSION" --work "$RUNNER_TEMP/feed-$os")
            [ "$os" = linux ] || args+=(--installer "dist/Conduit-$VERSION-windows-x64-setup.exe")
            state="$(winlinux_feed_state "$os")"
            if [ "$state" = live ]; then
              live="$RUNNER_TEMP/live-$os.xml"
              curl -fsSL --retry 3 -o "$live" "$(python3 -I desktop/packaging/winlinux_feed.py url "$os")"
              key="$(feed_signing_key "$live" "$os" "${!public}" "${!retired}")"
              args+=(--existing "$live")
              [ "$key" = "${!public}" ] || args+=(--feed-public-key "$key")
            else
              args+=(--allow-new)
            fi
            [ "${!app}" = "${!public}" ] || args+=(--next-public-key "${!app}")
            desktop/packaging/winlinux-appcast.sh "${args[@]}"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.DRY_RUN == 'true'
        with:
          name: desktop-dry-run-throwaway-keys
          path: ${{ runner.temp }}/throwaway-keys
      # New feeds for 0.0.0, at the Mac dry run's download URLs: the install
      # smokes serve them, and the gate rehearsal checks them.
      - name: New Windows and Linux feeds (dry run, throwaway keys)
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          for os in windows linux; do
            OS="$(printf '%s' "$os" | tr a-z A-Z)"
            app="${OS}_APP_KEY"
            args=(--os "$os" --version "$VERSION" --fresh --work "$RUNNER_TEMP/feed-$os")
            if [ "$os" = windows ]; then
              args+=(--installer "dist/Conduit-$VERSION-windows-x64-setup.exe" --download-url-prefix https://example.invalid/dry-run/)
            fi
            (
              export "${OS}_ED_PRIVATE_KEY=$(cat "$RUNNER_TEMP/throwaway-keys/$os-private-key.txt")" "${OS}_PUBLIC_ED_KEY=${!app}"
              desktop/packaging/winlinux-appcast.sh "${args[@]}"
            )
          done
      - name: The Windows and Linux release files, with their checksums
        shell: bash
        run: |
          set -euo pipefail
          out=release-files
          mkdir "$out"
          cp "dist/Conduit-$VERSION-windows-x64-setup.exe" "$RUNNER_TEMP/feed-windows/appcast-windows.xml" "$out/"
          cp notices/windows/THIRD_PARTY_NOTICES.md "$out/THIRD_PARTY_NOTICES-windows.md"
          cp "dist/conduit-desktop_$VERSION-1_amd64.deb" "dist/conduit-desktop-$VERSION-1.x86_64.rpm" \
            "$RUNNER_TEMP/feed-linux/appcast-linux.xml" "$out/"
          cp notices/linux/THIRD_PARTY_NOTICES.md "$out/THIRD_PARTY_NOTICES-linux.md"
          desktop/packaging/release_gate.sh sums --os windows --version "$VERSION" --dir "$out"
          desktop/packaging/release_gate.sh sums --os linux --version "$VERSION" --dir "$out"
          cat "$out"/SHA256SUMS-windows.txt "$out"/SHA256SUMS-linux.txt
      - name: Keep them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-winlinux-release
          path: release-files
          if-no-files-found: error
          retention-days: 5

  # On fresh runners, as a user meets them: install, the installed app's
  # smoke pass, removal (packaging/windows/smoke.ps1, packaging/linux/
  # smoke.sh), as desktop.yml's install smokes. The release's packages read
  # the live feed (an outcome the smoke reports and never fails on); a dry
  # run's read its own feed, served on 127.0.0.1, and must find nothing
  # newer.
  smoke-windows:
    name: Windows install smoke
    needs: [winlinux-config, winlinux-feeds]
    if: github.event_name != 'release'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.winlinux-config.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-winlinux-release
          path: release-files
      - name: Install, smoke-test and uninstall
        shell: pwsh
        run: |
          $feed = @{}
          if ($env:DRY_RUN -eq 'true') {
            New-Item -ItemType Directory -Force -Path feeds/windows | Out-Null
            Copy-Item -LiteralPath release-files/appcast-windows.xml -Destination feeds/windows/
            $feed = @{ UpdateFeed = 'feeds/windows'; UpdateFeedPort = 8471 }
          }
          ./desktop/packaging/windows/smoke.ps1 -Installer "release-files/Conduit-$($env:VERSION)-windows-x64-setup.exe" `
            -Work "$env:RUNNER_TEMP/conduit-smoke" @feed
      - name: Keep the smoke's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-smoke
          path: ${{ runner.temp }}/conduit-smoke
          retention-days: 5

  smoke-linux:
    name: Linux install smoke
    needs: [winlinux-config, winlinux-feeds]
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.winlinux-config.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-winlinux-release
          path: release-files
      - name: Install Xvfb, Mesa, GNOME Keyring, secret-tool and desktop-file-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            gnome-keyring libsecret-tools desktop-file-utils
      - name: Install, smoke-test and remove the .deb
        run: |
          feed=()
          if [ "$DRY_RUN" = true ]; then
            mkdir -p feeds/linux
            cp release-files/appcast-linux.xml feeds/linux/
            feed=(--update-feed feeds/linux --update-feed-port 8471)
          fi
          desktop/packaging/linux/smoke.sh ${feed[@]+"${feed[@]}"} \
            "release-files/conduit-desktop_${VERSION}-1_amd64.deb" "$RUNNER_TEMP/conduit-smoke"
      - name: The .deb in clean Ubuntu 22.04 and Debian 12
        run: |
          for image in ubuntu:22.04 debian:12; do
            echo "::group::$image"
            docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" "$image" \
              bash /src/desktop/packaging/linux/smoke.sh --container "/src/release-files/conduit-desktop_${VERSION}-1_amd64.deb"
            echo "::endgroup::"
          done
      - name: The .rpm in a clean Fedora
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" fedora:latest \
            bash /src/desktop/packaging/linux/smoke.sh --container "/src/release-files/conduit-desktop-${VERSION}-1.x86_64.rpm"
      - name: Keep the smoke's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-smoke
          path: ${{ runner.temp }}/conduit-smoke
          retention-days: 5

  # A tag: puts the Windows and Linux files on the draft (looked up again
  # before each, as the Mac's job does: a published release is never
  # changed), then the publish gate (packaging/release_gate.sh) on every
  # file the draft carries, as GitHub serves them: each OS's files, each
  # matching its checksum file, and the three feeds signed with the keys
  # installed copies have, with this version on top. Only then does the
  # draft get its release notes (packaging/release-notes.md), so a draft
  # still saying it is being built is not ready to publish.
  # A dry run: the same gate on the dry run's files, which must pass, and
  # must refuse each file in turn when it is missing. Nothing is published.
  release:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Publish gate (rehearsal, nothing published)' || 'Complete the draft, publish gate' }}
    needs: [winlinux-config, draft, build, winlinux-feeds, smoke-windows, smoke-linux]
    if: >-
      ${{ !cancelled() && github.event_name != 'release' &&
      needs.build.result == 'success' && needs.winlinux-feeds.result == 'success' &&
      needs.smoke-windows.result == 'success' && needs.smoke-linux.result == 'success' &&
      (needs.draft.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.draft.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-desktop-complete-${{ github.event_name == 'workflow_dispatch' && 'dry-run' || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.winlinux-config.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-winlinux-release
          path: release-files
      - name: Put the Windows and Linux files on the draft
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          still_draft() {
            local draft
            draft="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" &&
              [ "$draft" = true ]
          }
          for asset in release-files/*; do
            if ! still_draft; then
              echo "::error::$GITHUB_REF_NAME is no longer a draft (or could not be looked up): its files stay as they are"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber "$asset"
          done
      - name: Publish gate, then the release notes
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          WINDOWS_PUBLIC_ED_KEY: ${{ vars.WINDOWS_PUBLIC_ED_KEY }}
          LINUX_PUBLIC_ED_KEY: ${{ vars.LINUX_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/draft"
          mkdir -p "$dir"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D "$dir"
          desktop/packaging/release_gate.sh check --version "$VERSION" --dir "$dir"
          sed "s/@VERSION@/$VERSION/g" desktop/packaging/release-notes.md >"$RUNNER_TEMP/notes.md"
          draft="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" != true ]; then
            echo "::error::$GITHUB_REF_NAME was published during this run: its notes stay as they are"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "## The draft $GITHUB_REF_NAME is complete"
            echo
            echo "Every OS's files are on it and the publish gate passes. Check it, then publish it (never as Latest)."
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.DRY_RUN == 'true'
        with:
          name: desktop-dry-run-mac-files
          path: mac-files
      - name: Publish gate rehearsal (dry run)
        if: env.DRY_RUN == 'true'
        shell: bash
        env:
          WINDOWS_PUBLIC_ED_KEY: ${{ needs.winlinux-config.outputs.windows-key }}
          LINUX_PUBLIC_ED_KEY: ${{ needs.winlinux-config.outputs.linux-key }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/dry-run-release"
          aside="$RUNNER_TEMP/aside"
          mkdir -p "$dir" "$aside"
          cp release-files/* "$dir/"
          cp "mac-files/Conduit-$VERSION.dmg" "mac-files/Conduit-$VERSION-dSYMs.zip" mac-files/appcast.xml \
            mac-files/SHA256SUMS.txt "$dir/"
          SPARKLE_PUBLIC_ED_KEY="$(cat mac-files/sparkle-public-key.txt)"
          export SPARKLE_PUBLIC_ED_KEY
          gate=(desktop/packaging/release_gate.sh check --version "$VERSION" --dir "$dir"
            --download-url-prefix https://example.invalid/dry-run/)
          "${gate[@]}"
          for os in mac windows linux; do
            for f in $(desktop/packaging/release_gate.sh assets --os "$os" --version "$VERSION"); do
              mv "$dir/$f" "$aside/"
              rc=0
              "${gate[@]}" >"$RUNNER_TEMP/gate.log" 2>&1 || rc=$?
              mv "$aside/$f" "$dir/"
              if [ "$rc" != 1 ] || ! grep -qF "missing: $f" "$RUNNER_TEMP/gate.log"; then
                cat "$RUNNER_TEMP/gate.log"
                echo "::error::the publish gate did not refuse a release without $f (exit $rc)"
                exit 1
              fi
              echo "the publish gate refuses a release without $f"
            done
          done
          "${gate[@]}"
          {
            echo "## Publish gate rehearsal: passed"
            echo
            echo "Every OS's dry-run files pass the gate, and it refuses each one when that file is missing. The release notes a tag would get:"
            echo
            sed "s/@VERSION@/$VERSION/g" desktop/packaging/release-notes.md
          } >>"$GITHUB_STEP_SUMMARY"

  # Publishing a desktop draft makes its three feeds live. It runs once the
  # release is public (GitHub lets no workflow stop a publication).
  # Checked first, before anything changes: the publish gate (every OS's
  # files and feeds, as `release` checked the draft; a release it refuses
  # goes back to a draft). Then the Mac's appcast as before: it is this
  # release's (its newest item is this version, at this release's DMG,
  # which now downloads), its checksum is the one the build recorded, it
  # keeps every item the live feed has (a release published since this
  # draft was built would otherwise drop out), and it is signed with the
  # key installed copies have. Then the Windows and Linux feeds by the same
  # rules. Only then is each published, the Mac's first. GitHub has no way
  # to swap three files at once: when one publication fails after another
  # went live, re-run this job. A feed already live is left as it is
  # (publish-appcast.sh), and the rest go live.
  feed:
    name: Publish the update feed
    if: >-
      github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, 'desktop-v') &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Its own group: no other event's run can replace a pending publication.
    concurrency:
      group: release-desktop-feed
      cancel-in-progress: false
      # Every pending publication waits its turn (up to 100), in order:
      # none is replaced by a newer one, so no release's item is skipped.
      queue: max
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      WINDOWS_PUBLIC_ED_KEY: ${{ vars.WINDOWS_PUBLIC_ED_KEY }}
      LINUX_PUBLIC_ED_KEY: ${{ vars.LINUX_PUBLIC_ED_KEY }}
    steps:
      # The release event's own commit (GITHUB_SHA), never a ref name a
      # branch could share with the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Nothing goes live unless the release carries every OS's files and
      # the three feeds, each matching its checksum file and signed with the
      # key installed copies have (packaging/release_gate.sh). A release the
      # gate refuses goes back to a draft, so no OS's files stay public
      # without the others; a gate that could not run (a lookup or a
      # download failed) changes nothing: re-run the job.
      - name: Publish gate (every OS's files and feeds)
        shell: bash
        run: |
          . desktop/packaging/macos/lib.sh
          [ "$GITHUB_REPOSITORY" = "$RELEASE_REPO" ] || { echo "::error::not $RELEASE_REPO"; exit 1; }
          version="${TAG#desktop-v}"
          check_version "$version"
          refuse_beta_release "$version"
          dir="$RUNNER_TEMP/gate"
          mkdir -p "$dir"
          names="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')" ||
            { echo "::error::could not list the files of $TAG: nothing changed; re-run the job"; exit 1; }
          if [ -n "$names" ]; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$dir" ||
              { echo "::error::could not download the files of $TAG: nothing changed; re-run the job"; exit 1; }
          fi
          rc=0
          desktop/packaging/release_gate.sh check --version "$version" --dir "$dir" || rc=$?
          case "$rc" in
            0) echo "GATE_DIR=$dir" >>"$GITHUB_ENV" ;;
            1)
              echo "::error::the publish gate refuses $TAG (the log says why): it goes back to a draft, and no feed changes (docs/RELEASING-DESKTOP.md, \"The publish gate refuses a release\")"
              gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=true ||
                echo "::error::$TAG could not be put back to a draft: do it by hand (gh release edit $TAG --draft=true)"
              exit 1
              ;;
            *)
              echo "::error::the publish gate could not run (exit $rc; the log says why): nothing changed; re-run the job"
              exit 1
              ;;
          esac
      - name: Fetch the release's appcast
        shell: bash
        run: |
          . desktop/packaging/macos/lib.sh
          [ "$GITHUB_REPOSITORY" = "$RELEASE_REPO" ] || { echo "::error::not $RELEASE_REPO"; exit 1; }
          version="${TAG#desktop-v}"
          check_version "$version"
          refuse_beta_release "$version"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$dir" -p appcast.xml -p SHA256SUMS.txt
          (cd "$dir" && grep ' appcast.xml$' SHA256SUMS.txt | shasum -a 256 -c -)
          code="$(curl -sSL -o "$dir/live.xml" -w '%{http_code}' "$(appcast_url)" || true)"
          case "$code" in
            200) ;;
            404)
              # A first release only when no feed was ever published: a feed
              # host that exists but has no appcast.xml (a publication that
              # stopped half way) is never read as an empty history.
              if [ "$(feed_exists)" != no ]; then
                echo "::error::the feed host exists but $(appcast_url) answers 404: a publication stopped half way? See docs/RELEASING-DESKTOP.md, \"A stale or missing appcast\""
                exit 1
              fi
              echo "no feed was ever published: this is the first release"
              printf '<rss/>' > "$dir/live.xml"
              ;;
            *) echo "::error::could not fetch the live feed (HTTP $code)"; exit 1 ;;
          esac
          dmg_url="https://github.com/$RELEASE_REPO/releases/download/$TAG/Conduit-$version.dmg"
          # The DMG as installed copies will download it, checked against the
          # build's checksum and against the signed enclosure (its length and
          # EdDSA signature, with the public key every installed copy has):
          # a DMG swapped on the draft never goes live.
          curl -fsSL -o "$dir/Conduit-$version.dmg" "$dmg_url" || { echo "::error::$dmg_url does not download (is the release public?)"; exit 1; }
          (cd "$dir" && grep " Conduit-$version.dmg\$" SHA256SUMS.txt | shasum -a 256 -c -) ||
            { echo "::error::$dmg_url is not the DMG the build recorded in SHA256SUMS.txt"; exit 1; }
          verify_enclosure "$dir/appcast.xml" "$(build_number "$version")" "$dir/Conduit-$version.dmg" "$SPARKLE_PUBLIC_ED_KEY" ||
            { echo "::error::$dmg_url does not match the appcast's signed enclosure"; exit 1; }
          python3 -I - "$dir/appcast.xml" "$dir/live.xml" "$(build_number "$version")" "$dmg_url" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          new, live, build, url = sys.argv[1:]
          ns = {"sparkle": "http://www.andymatuschak.org/xml-namespaces/sparkle"}
          def builds(path):
              return [(i.findtext("sparkle:version", namespaces=ns) or "").strip()
                      for i in ET.parse(path).getroot().iter("item")]
          items = list(ET.parse(new).getroot().iter("item"))
          newest = max(items, key=lambda i: int((i.findtext("sparkle:version", namespaces=ns) or "0").strip()))
          enc = newest.find("enclosure")
          problems = []
          if (newest.findtext("sparkle:version", namespaces=ns) or "").strip() != build:
              problems.append(f"the newest item is not build {build}")
          if enc is None or enc.get("url") != url:
              problems.append(f"the newest item does not download {url}")
          lost = sorted(set(builds(live)) - set(builds(new)))
          if lost:
              problems.append(f"the live feed has builds this appcast lacks: {lost}; rebuild the release")
          if problems:
              sys.exit("::error::" + "; ".join(problems))
          print(f"appcast ok: build {build} on top, {len(items)} items, nothing lost")
          EOF
          command -v xmllint >/dev/null || sudo apt-get install -y libxml2-utils
          echo "APPCAST=$dir/appcast.xml" >> "$GITHUB_ENV"
      # Each OS's feed as the Mac's: the gate checked that it is this
      # release's, signed, with this version on top. Here: it keeps every
      # item the OS's live feed has (none on that OS's first release), and
      # what installed copies download is what the gate checked: the
      # installer at the URL its item names (WinSparkle's download), and the
      # .deb and the .rpm on the release page.
      - name: Check the Windows and Linux feeds against the live ones
        shell: bash
        run: |
          . desktop/packaging/macos/lib.sh
          version="${TAG#desktop-v}"
          base="https://github.com/$RELEASE_REPO/releases/download/$TAG"
          public="$RUNNER_TEMP/public"
          mkdir -p "$public"
          for f in "Conduit-$version-windows-x64-setup.exe" "conduit-desktop_$version-1_amd64.deb" \
            "conduit-desktop-$version-1.x86_64.rpm"; do
            curl -fsSL --retry 3 -o "$public/$f" "$base/$f" ||
              { echo "::error::$base/$f does not download (is the release public?)"; exit 1; }
            cmp -s "$public/$f" "$GATE_DIR/$f" ||
              { echo "::error::$base/$f is not the file the publish gate checked"; exit 1; }
          done
          for os in windows linux; do
            checks=(check --os "$os" --feed "$GATE_DIR/appcast-$os.xml" --version "$version")
            state="$(winlinux_feed_state "$os")"
            if [ "$state" = live ]; then
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/live-$os.xml" "$(python3 -I desktop/packaging/winlinux_feed.py url "$os")" ||
                { echo "::error::could not fetch the live $os feed"; exit 1; }
              checks+=(--old "$RUNNER_TEMP/live-$os.xml")
            else
              echo "no $os feed was ever published: this is its first release"
            fi
            if [ "$os" = windows ]; then
              checks+=(--installer "$public/Conduit-$version-windows-x64-setup.exe"
                --url "$base/Conduit-$version-windows-x64-setup.exe")
            fi
            python3 -I desktop/packaging/winlinux_feed.py "${checks[@]}" ||
              { echo "::error::the $os feed of $TAG is not safe to publish over the live one (the log says why; docs/RELEASING-DESKTOP.md, \"A stale or missing appcast\")"; exit 1; }
          done
      # publish-appcast.sh checks the feed's own signature with
      # SPARKLE_PUBLIC_ED_KEY, the key installed copies have, before it
      # uploads anything: a feed swapped on the draft together with
      # SHA256SUMS.txt, or signed with another key, never goes live.
      - name: Publish the appcast
        run: desktop/packaging/macos/publish-appcast.sh "$APPCAST" --push
      # The same for each OS's feed, with its own public key, beside the
      # Mac's appcast.xml on the feed release (which the step above makes on
      # the first desktop release).
      - name: Publish the Windows and Linux feeds
        run: |
          desktop/packaging/macos/publish-appcast.sh "$GATE_DIR/appcast-windows.xml" --push --os windows
          desktop/packaging/macos/publish-appcast.sh "$GATE_DIR/appcast-linux.xml" --push --os linux
