name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-notes:
    name: Validate Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Only the third_party/ path dependencies; openwebui-src/ and
      # hermes-src/ are reference sources no build step reads.
      - parallel:
          - name: Set Up Flutter
            uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
            with:
              channel: 'stable'
              cache: true
          - name: Fetch third_party submodules
            run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid

      - name: Install Dependencies
        run: flutter pub get

      - name: Validate baked release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dart run tool/validate_release_notes.dart --version "$VERSION"

  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: validate-release-notes
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create Release with Notes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          makeLatest: true

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: generate-release-notes
    permissions:
      contents: write

    steps:
        #1 Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

        #2 Setup Java, Gradle and Flutter side by side
      # Only the third_party/ path dependencies; openwebui-src/ and
      # hermes-src/ are reference sources no build step reads.
      - parallel:
          - name: Set Up Java
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '21'
          - name: Setup Gradle and caching
            uses: gradle/actions/setup-gradle@v3
            with:
              cache-read-only: false
          - name: Set Up Flutter
            uses: subosito/flutter-action@v2
            with:
              channel: 'stable'
              cache: true
          - name: Fetch third_party submodules
            run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid

        #4 Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Each workspace member keeps its own build cache, and the app never
      # waited on the packages' output, so they generate side by side.
      - parallel:
          - name: Generate code (app)
            run: dart run build_runner build
          - name: Generate code (packages)
            shell: bash
            run: |
              for dir in packages/* apps/*; do
                if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
                  echo "::group::build_runner in $dir"
                  (cd "$dir" && dart run build_runner build)
                  echo "::endgroup::"
                fi
              done

      

        #5 Setup Keystore
      - name: Create Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/conduit-keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}" | base64 --decode > key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        working-directory: android
      
      - name: Build APK
        run: flutter build apk --split-per-abi --target-platform android-arm,android-arm64 --release

      - name: Build appBundle
        run: flutter build appbundle --target-platform android-arm,android-arm64 --release

      # Both only read the built files.
      - parallel:
          - name: Upload Artifacts
            uses: actions/upload-artifact@v4
            with:
              name: Android-Release
              path: |
                build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
                build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
                build/app/outputs/bundle/release/app-release.aab
          - name: Update Release with Artifacts
            uses: ncipollo/release-action@v1
            with:
              artifacts: "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk,build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk,build/app/outputs/bundle/release/app-release.aab"
              tag: ${{ github.ref_name }}
              token: ${{ secrets.GITHUB_TOKEN }}
              allowUpdates: true
              makeLatest: true
              omitBody: true
              omitBodyDuringUpdate: true
              omitNameDuringUpdate: true


  build-ios:
    name: Build iOS
    runs-on: macos-26
    needs: generate-release-notes
    permissions:
      contents: write

    steps:
        #1 Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

        #2 Setup Flutter
      # Only the third_party/ path dependencies; openwebui-src/ and
      # hermes-src/ are reference sources no build step reads.
      - parallel:
          - name: Set Up Flutter
            uses: subosito/flutter-action@v2
            with:
              channel: 'stable'
              cache: true
          - name: Fetch third_party submodules
            run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid

        #3 Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

        #4 Setup Xcode
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

        #5 Cache CocoaPods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # Each workspace member keeps its own build cache, and the app never
      # waited on the packages' output, so they generate side by side.
      # CocoaPods needs only what `pub get` wrote, so it installs alongside.
      - parallel:
          - name: Generate code (app)
            run: dart run build_runner build
          - name: Generate code (packages)
            shell: bash
            run: |
              for dir in packages/* apps/*; do
                if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
                  echo "::group::build_runner in $dir"
                  (cd "$dir" && dart run build_runner build)
                  echo "::endgroup::"
                fi
              done
          - name: Install CocoaPods
            run: |
              cd ios
              pod install --verbose

        #6 Cache Xcode DerivedData
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('ios/Podfile.lock', 'ios/Runner.xcodeproj/project.pbxproj', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build iOS App
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/ios/Flutter/ArmOnly.xcconfig
        run: |
          flutter build ios --release --no-codesign

        #7 Create IPA from App Bundle
      - name: Create IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/Release-iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/conduit.ipa Payload
          cd ../ipa

        #8 Upload Artifacts and #9 Update Release: both only read the IPA.
      - parallel:
          - name: Upload Artifacts
            uses: actions/upload-artifact@v4
            with:
              name: iOS-Release
              path: |
                build/ios/ipa/*.ipa
          - name: Update Release with IPA
            uses: ncipollo/release-action@v1
            with:
              artifacts: "build/ios/ipa/conduit.ipa"
              tag: ${{ github.ref_name }}
              token: ${{ secrets.GITHUB_TOKEN }}
              allowUpdates: true
              makeLatest: true
              omitBody: true
              omitBodyDuringUpdate: true
              omitNameDuringUpdate: true
